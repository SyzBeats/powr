packages:
  - apps/*
  - packages/*
  - tools/*

# Supply chain (§8.18, ADR-0021): new versions must be at least 7 days old.
minimumReleaseAge: 10080

# Exact versions pinned by the technical concept (Appendix B) that were younger than
# 7 days when M0 was set up. Remove the whole list after 2026-12-01, when all of them have
# matured (ADR-0021, TD-18; reminder in IMPLEMENTATION_NOTES.md section 4).
minimumReleaseAgeExclude:
  - pnpm
  - '@pnpm/exe.*'
  - oxlint@1.95.0
  - '@oxlint/*'
  - oxfmt@0.80.0
  - '@oxfmt/*'
  - oxlint-tsgolint@7.0.2008
  - '@oxlint-tsgolint/*'
  - knip@6.48.0
  - lucide-react@1.78.0
  - vitest@5.1.1
  - '@vitest/*'
  - fast-check@4.11.0

# Dependency install scripts are blocked unless listed here. None of the current dependencies
# needs one (Rolldown, oxlint and oxfmt ship prebuilt binaries as optional packages).
allowBuilds: {}

savePrefix: ''

# Lighthouse CI (build-only, TD-12) pulls two packages that the licence gate rejects and that our
# use never loads, so they are not installed at all: Lighthouse imports @sentry/node only with
# --enable-error-reporting (its `sentry` CLI dependency is FSL-1.1-Apache-2.0, source-available),
# and js-yaml 5 uses argparse (PSF-2.0, not on the allowlist) only in its own command-line binary.
overrides:
  'lighthouse>@sentry/node': '-'
  'js-yaml@5>argparse': '-'

# pnpm 12 asks before a package installs agent "skills"; we do not let dependencies do that.
permissions:
  '@tanstack/react-router':
    skills: false
  '@tanstack/router-plugin':
    skills: false
