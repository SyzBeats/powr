- id: load.trend.changeThresholds
  value: { likelyTe: 1, likelyZ: 1.5, sustainSessions: 3, veryLikelyTe: 2.8 }
  unit: mixed
  guard: { sustainSessions: { min: 2, max: 3 } }
  evidence: [SR, MODEL, INF]
  sources:
    - src.hopkins2000
    - src.grgic2020
    - src.durbin2012
    - src.stephenshemingway2020
    - src.powr-eb-load
  ebRef: 'EB §Defaults › Load ("likely real" > 1 TE for ≥ 2–3 sessions; "very likely" > 2.8 TE or its credible interval excludes zero)'
  verified: false
  userOverridable: false
  note: >-
    Any claim needs the smoothed change beyond likelyTe typical errors (EB) and, rules 1.6.0,
    beyond likelyZ standard deviations of its own uncertainty (the filter's variances of both
    points, which ignore their positive covariance and so overstate it). The TE rule alone assumes
    the smoothed values are much more precise than one TE; with session e1RMs as noisy as the
    filter assumes (9% for typical sets), it claimed a change in over 80% of flat 12-week series.
    likelyZ 1.5 is the product owner's choice of 2026-11-25 (strict, honesty first): under that
    realistic noise, likelyZ 1 still claimed a change in about 30–33% of flat 12-week series of
    typical sets, 1.5 in about 6–9%, at the cost of slower recognition of real gains (median
    weeks to a claim on typical sets: intermediate +1% a week 11.6 → 15, novice +2% a week 10 →
    12.6). likelyZ and sustainSessions 3 (the EB's upper end) are POWR design values from the
    seeded simulation (packages/domain/test/reference/trend-calibration.test.ts). T-01
    (2026-11-25): likelyTe and veryLikelyTe (1.96 × √2 × TE ≈ 2.77) follow the EB and Hopkins
    2000; no study validates labelling rules for smoothed e1RM series, so the row stays a design
    value.

- id: load.trend.reference
  value: { weeks: { novice: 4, intermediate: 8, advanced: 12 }, sessions: 3 }
  unit: mixed
  evidence: [MA, OBS, INF]
  sources:
    - src.swinton2022
    - src.ahtiainen2003
    - src.solberg2019
    - src.grgic2020
    - src.powr-eb-progression
    - src.powr-technical-concept
  ebRef: 'technical concept §8.7.5 (reference weeks or 3 sessions earlier, whichever is older); EB §Progression › Classification (slope over the last 8–12 weeks)'
  verified: false
  userOverridable: false
  note: >-
    Rules 1.6.0: the window is by level. A label compares the change over the window with one TE,
    so a steady gain g a week can only show once g × weeks > TE: with 4 weeks for everyone,
    trained lifters needed more than 0.83% a week (3.3% / 4) and a realistic intermediate 0.5% a
    week was never labelled. 8 weeks lets 0.5% a week show (4% > 3.3%); novices keep 4 weeks
    (5.5% / 4 = 1.4% a week, below their usual 1–2%) so stalls and dips still show quickly. The
    EB classifies by the slope over 8–12 weeks. Rules 1.7.0 (TD-60): advanced lifters get the
    12-week end (their good-block 0.25–0.5% a week needs the longer window to pass one TE: 3–6%
    over 12 weeks), now that the session engine keeps 60 trend points and exposures (12 weeks at
    up to 4 sessions a week); rules 1.6.0 had 8 because it kept 30. The series' first `sessions`
    points are never the reference (barely smoothed); while a series is shorter than the window
    its oldest point after them is. A POWR design value: the windows are derived from the
    verified typical errors and realistic rates, not measured (T-01, 2026-11-25).

