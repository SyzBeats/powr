- id: load.trend.processSdPerWeek
  value: { novice: 0.02, intermediate: 0.01, advanced: 0.005 }
  unit: fraction
  evidence: [MA, OBS, MODEL, INF]
  sources:
    - src.swinton2022
    - src.androulakiskorakakis2020
    - src.ahtiainen2003
    - src.solberg2019
    - src.mcmaster2013
    - src.kolossa2017
    - src.durbin2012
    - src.powr-eb-progression
    - src.powr-technical-concept
  ebRef: 'technical concept §8.7.5 (trend.processSdPctPerWeek by level); EB §Progression › Realistic strength progress, › Classification'
  verified: false
  userOverridable: false
  note: >-
    Weekly random-walk SD of ln(e1RM), the prior for how fast a lifter's true e1RM moves: about the
    top of each level's weekly rate (novice 1–2%, up to 3–4% in the first weeks of a lift;
    trained 0.2–1% in 8–12-week trials; advanced 0.02–0.1% long-run, with real swings of a few
    percent around peaking, fatigue and breaks). Rules 1.6.0 re-checked the values against the
    literature and a seeded simulation (packages/domain/test/reference/trend-calibration.test.ts)
    and kept them: with the uncertainty gate of load.trend.changeThresholds, 1.5–2 times these
    values labelled real gains at most a week sooner but doubled the false claims on heavy sets;
    the slow labels came from the 4-week window (now load.trend.reference). The state-space
    literature fixes the observation noise from reliability data and estimates the process noise
    per person by maximum likelihood once enough data exist (proposed as a later step). A POWR
    design value; T-01 (2026-11-25) found no study of the week-to-week variance of a lifter's true
    strength and kept it.

