# Load, e1RM and change detection (EB §Defaults › Load; EB §Load). Technical concept §8.7.4–8.7.7.
# Not shipped: Lombardi, Lander and O'Conner (EB §Gaps #4), the Marzagao weight-dependent formula
# (§Gaps #3: unverified, the 100 × 5 example does not reproduce), regression equations with
# intercepts (Reynolds linear, Macht, Tucker…), velocity-based 1RM prediction (§Gaps #13; VBT is
# out of scope, NG-06), the personal-curve fit and the correction factor (M1 remaining work).

