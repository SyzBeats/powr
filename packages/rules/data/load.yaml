# PR detection (MOT-01, M3). e1RM PRs are estimates: only sets the e1RM pipeline trusts produce
# them (EB §Load › Real change; PRD R-07 "e1RM noise causes false PRs").

- id: load.pr.minSetWeight
  value: 0.5
  unit: fraction
  range: { min: 0.1, max: 1 }
  evidence: [INF]
  sources: [src.powr-prd, src.halperin2022, src.grgic2020]
  ebRef: 'PRD MOT-01 (e1RM PR only from qualifying sets per PRG-01 weighting), R-07; EB §Load › e1RM algorithm (set weights 1.0 / 0.5 / ≤ 0.1)'
  verified: false
  userOverridable: false
  note: >-
    A POWR design value: the set's base weight (RPE and effective-rep tiers, before the set-order
    decay) must reach the 0.5 tier (RPE ≥ 7 and ≤ 12 effective reps). Sets without entered
    effort never qualify (load.unknownEffort.eligibleForE1rmPr, E-1). T-01 (2026-11-25): RIR
    errors grow sharply above 12 reps (Halperin 2022) and far from failure (RPE < 7), which
    supports the cut; where exactly to cut is a product trade-off.

# M4a (rules 1.5.0): the rep-range artefact flag of PRG-02 (TD-26).

- id: load.trend.repRangeShift
  value: 3
  unit: reps
  range: { min: 2, max: 6 }
  evidence: [OBS, INF]
  sources: [src.braith1993, src.mayhew2008, src.nuzzo2024, src.powr-eb-load]
  ebRef: 'EB §Load › e1RM drift (flag e1RM jumps that coincide with a change in typical rep range); PRD PRG-02'
  verified: false
  userOverridable: false
  note: >-
    A POWR design value: a "likely real" change is flagged as possibly a rep-range effect when the
    median reps of the latest sessions differ from those around the reference by at least this
    many reps. T-01 (2026-11-25): with the between-person spread of reps to failure (Nuzzo 2024:
    SD 2.51 reps at 80% 1RM), a 3-rep shift can move the e1RM by about half to one trained typical
    error; no study gives the number.
