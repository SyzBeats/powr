  unit: none
  guard: { epleyBrzyckiReliableUpToReff: 6 }
  evidence: [PRACT, OBS, INF]
  sources: [src.mayhew2008, src.reynolds2006, src.powr-eb-load]
  ebRef: 'EB §Defaults › Load (e1RM formula); §Load › Rep-max equations; §Gaps #4'
  verified: true
  userOverridable: true
  note: >-
    Applies to bench-like exercises (load.curve.classMap). "rts" selects the exact RTS lookup,
    which the EB shows tracks Wathan within about 0.6 points for 2–10 effective reps.

