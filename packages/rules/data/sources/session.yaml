- id: src.grgic2018b
  citation: >-
    Grgic et al. 2018. [Rest interval duration and strength gains: systematic review; untrained
    people maximise strength with 60–120 s, trained people need more than 2 min.]
  url: https://www.pubmed.gov/28933024/
  seeAlso:
    - https://vuir.vu.edu.au/38537/
  tag: SR
  status: active
  note: The suffix b follows EB order; Grgic 2018 on frequency (PubMed 29470825) is mentioned first.

