# Every source the evidence base cites in "Session design › Exercise-to-muscle mapping for volume
# attribution" (EB §Session › Mapping), in order of first citation, plus src.powr-eb-mapping for the
# convention (C) rows. Citations are as complete as the EB report and its research note
# (session_exercise_design.md §5) give them; [bracketed] text describes a work whose title the EB
# does not give. Links exactly as the EB gives them. Muscle credits cite these IDs (EXL-05).

- id: src.pelland2024
  citation: >-
    Pelland, Remmert, Robinson, Hinson & Zourdos. The resistance training dose-response:
    meta-regressions exploring the effects of weekly volume and frequency on muscle hypertrophy
    and strength gain. SportRxiv preprint (v2, 2024).
  url: https://sportrxiv.org/index.php/server/preprint/view/460
  tag: PREPRINT
  status: active
  note: >-
    Basis of fractional set counting (direct 1.0, indirect 0.5). Published as src.pelland2026;
    preprint numbers must be verified before hard-coding (E-2).

- id: src.pelland2026
  citation: >-
    Pelland JC, Remmert JF, Robinson ZP, Hinson SR & Zourdos MC 2026. The resistance training dose
    response: meta-regressions exploring the effects of weekly volume and frequency on muscle
    hypertrophy and strength gains. Sports Med 56(2):481–505. DOI 10.1007/s40279-025-02344-w.
  url: https://pubmed.ncbi.nlm.nih.gov/41343037/
  seeAlso:
    - https://osf.io/6z3xu
    - https://sponet.de/sponet/Record/4097139?lng=en
  tag: MA
  status: active
  note: >-
    The published abstract keeps fractional counting as the best-supported method. The
    supplementary data (OSF) reproduce the preprint's floor (4 sets), SDES (2.05% / 3.96%) and
    PUOS (31 sets; 3 sets; 3 sessions); the strength tiers differ (no detectable superiority from
    3 sets). Full text paywalled, not read (T-01, 2026-11-25).

- id: src.remmert2025
  citation: >-
    Remmert, Robinson, Pelland et al. 2025. [Per-session volume dose–response analysis comparing
    fractional and direct set counting.] SportRxiv preprint.
  url: https://sportrxiv.org/index.php/server/preprint/view/537
  tag: PREPRINT
  status: active
  note: >-
    No peer-reviewed version as of November 2026 (EB §Volume › Per-session returns); verify
    against the published paper before hard-coding (E-2).

