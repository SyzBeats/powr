  url: https://pubmed.ncbi.nlm.nih.gov/29628895/
  seeAlso:
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC5877330
  tag: RCT-T
  status: active

- id: src.zhang2021
  citation: >-
    Zhang et al. 2021. [Autoregulated vs fixed loading in athletes: meta-analysis of 8 studies,
