# Sources of the progression parameters (data/progression.yaml; EB "How the app progresses load
# matters more…" and "Consolidated default parameters › Progression, autoregulation and VBT").
# Citations as complete as the EB and its research note
# (progression_periodization_autoregulation.md) give them.

- id: src.plotkin2022
  citation: >-
    Plotkin et al. 2022. [Progression by adding repetitions vs adding load; 43 trained
    participants.]
  url: https://pubmed.ncbi.nlm.nih.gov/36199287/
  tag: RCT-T
  status: active

- id: src.acsm2009
  citation: >-
    American College of Sports Medicine (Ratamess NA, Alvar BA, Evetoch TK, Housh TJ, Kibler WB,
    Kraemer WJ & Triplett NT) 2009. Progression models in resistance training for healthy adults.
    Med Sci Sports Exerc 41(3):687–708. DOI 10.1249/MSS.0b013e3181915670.
  url: https://pubmed.ncbi.nlm.nih.gov/19204579/
  seeAlso:
    - https://pubmed.ncbi.nlm.nih.gov/11828249/
  tag: POS
  status: active
  note: >-
    Position stand: increase load 2–10% when the current load is completed for 1–2 reps above
    target; 1–3 sets per exercise for novices, 3–6 for advanced hypertrophy training; about 6
    months of consistent training for "intermediate". The seeAlso link is the 2002 stand with the
    same 2–10% rule. Title completed by the T-01 evidence verification (2026-11-25).

