- id: src.plotkin2022
  citation: >-
    Plotkin et al. 2022. [Progression by adding repetitions vs adding load; 43 trained
    participants.]
  url: https://pubmed.ncbi.nlm.nih.gov/36199287/
  tag: RCT-T
  status: active

- id: src.acsm2009
  citation: >-
    American College of Sports Medicine 2009. [Position stand on progression models in resistance
    training: increase load 2–10% when the current load is completed for 1–2 reps above target.]
  url: https://pubmed.ncbi.nlm.nih.gov/19204579/
  seeAlso:
    - https://pubmed.ncbi.nlm.nih.gov/11828249/
  tag: POS
  status: active
  note: The seeAlso link is the 2002 stand with the same 2–10% rule.

- id: src.helms2018
