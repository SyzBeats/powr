  url: https://pubmed.ncbi.nlm.nih.gov/33776802/
  tag: MA
  status: active

- id: src.mann2010
  citation: >-
    Mann et al. 2010. [APRE vs linear periodization over 6 weeks in college football players.]
  url: https://pubmed.ncbi.nlm.nih.gov/20543732/
  tag: RCT-T
  status: active
  note: Small trial; the abstract gives the units garbled as N.

- id: src.huang2023
  citation: >-
    Huang Z, Ji H, Chen L, et al. 2023. Comparing autoregulatory progressive resistance exercise
    and velocity-based resistance training on jump performance in college badminton athletes.
    PeerJ 11:e15877. DOI 10.7717/peerj.15877. [Table 2 tabulates the APRE 6RM protocol: 10 × 50%,
    6 × 75%, AMRAP at the 6RM and the load adjustment by AMRAP reps.]
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10414022/table/table-2
  tag: PRACT
  status: active
  note: >-
    A reproduction of the APRE protocol table (citing Mann 2011). Its 13+ row mis-converts the
    original +10 to 15 lb to +5 to 10 kg (correct: 4.5–6.8 kg, +5 to 7.5 kg on plates); the other
    rows convert correctly. The table source is src.mann2011 (T-01, 2026-11-25).

