# Rules 1.6.0: the e1RM trend's process noise, change window and uncertainty gate (PRG-02). Sources
# found and checked against PubMed or the publisher for the trend calibration of 2026-11-25; the
# EB does not cite them yet.

- id: src.swinton2022
  citation: >-
    Swinton et al. 2022. Interpreting magnitude of
    change in strength and conditioning: effect size selection, threshold values and Bayesian
    updating. J Sports Sci 40(18):2047–2054. DOI 10.1080/02640414.2022.2128548.
  url: https://pubmed.ncbi.nlm.nih.gov/36184114/
  seeAlso:
    - https://doi.org/10.51224/SRXIV.11
  tag: MA
  status: active
  note: >-
    Pooled within-group changes of S&C interventions (mostly 6–12 weeks; 60% untrained samples):
    maximal strength +14.3% (meta-analytic mean), quartiles 6.0 / 13.6 / 22.7%, i.e. about 1–2% a
    week. The quartile values were read from the SportRxiv preprint; the published values may
    differ slightly (verify before hard-coding).

- id: src.ahtiainen2003
  citation: >-
    Ahtiainen et al. 2003. Muscle hypertrophy, hormonal adaptations
    and strength development during strength training in strength-trained and untrained men. Eur J
    Appl Physiol 89(6):555–563. DOI 10.1007/s00421-003-0833-3.
  url: https://pubmed.ncbi.nlm.nih.gov/12734759/
  tag: OBS
  status: active
  note: >-
    Same 21-week programme, 8 men per group (not randomised): maximal isometric leg-extension
    force +20.9% in untrained men vs +3.9% in strength athletes (about 1.0 vs 0.2% a week).

- id: src.androulakiskorakakis2020
  citation: >-
    Androulakis-Korakakis et al. 2020. The minimum effective training dose required to
    increase 1RM strength in resistance-trained men: a systematic review and meta-analysis. Sports
    Med 50(4):751–765. DOI 10.1007/s40279-019-01236-0.
  url: https://pubmed.ncbi.nlm.nih.gov/31797219/
  tag: MA
  status: active
  note: >-
    Single sets 1–3 times a week for 8–12 weeks in trained men: squat +17.5 kg, bench +8.25 kg
    (roughly 0.7–1.3% a week at typical baselines; the baselines are an assumption).

- id: src.solberg2019
  citation: >-
    Solberg, Hopkins et al. 2019. Peak age and performance progression in world-class
    weightlifting and powerlifting athletes. Int J Sports Physiol Perform 14(10):1357–1363.
  url: https://pubmed.ncbi.nlm.nih.gov/30958059/
  tag: OBS
  status: active
  note: >-
    Powerlifters improved 12% (SD 10%) over the 5 years before peak age, about 2–2.5% a year
    (about 0.05% a week).

- id: src.kolossa2017
  citation: >-
    Kolossa et al. 2017. Performance
    estimation using the fitness-fatigue model with Kalman filter feedback. Int J Comput Sci Sport
    16(2):117–129. DOI 10.1515/ijcss-2017-0010.
  url: https://doi.org/10.1515/ijcss-2017-0010
  tag: MODEL
  status: active
  note: >-
    Observation noise fixed from measurement reliability; the state (process) noise fitted to
    data within bounds; with scarce individual data, parameters pooled across athletes predicted
    better than individual fits.

- id: src.durbin2012
  citation: >-
    Durbin & Koopman 2012. Time Series Analysis by State Space Methods, 2nd edition. Oxford
    University Press. DOI 10.1093/acprof:oso/9780199641178.001.0001.
  url: https://doi.org/10.1093/acprof:oso/9780199641178.001.0001
  tag: MODEL
  status: active
  note: >-
    The local-level model: the signal-to-noise ratio of process and observation variance sets the
    steady-state gain (equivalent to exponential smoothing); the variances are estimated by
    maximum likelihood when enough data exist; the filter's posterior variance is the uncertainty
    of the level.

- id: src.stephenshemingway2020
  citation: >-
    Stephens Hemingway et al. 2020. The effects of measurement error and
    testing frequency on the fitness-fatigue model applied to resistance training: a simulation
    approach. Int J Sports Sci Coach 15(1):60–71. DOI 10.1177/1747954119887721.
  url: https://doi.org/10.1177/1747954119887721
  tag: MODEL
  status: active
  note: >-
    In 16-week simulations of intermediate and advanced lifters, a measurement CV above about 4%
    made the model's predictions unsatisfactory, worse with less frequent testing.

# Rules 1.8.0 (T-01 evidence verification, 2026-11-25; docs/release/evidence-verification.md):
# the RIR-bias sources (EB §Gaps #26), the noise sources of load.trend.noiseTypicalSd and the
# peer-reviewed comparison chart of load.curve.rts. Citations and DOIs as the report gives them.

- id: src.russo2025
  citation: >-
    Russo F, Marconcin P, Gomes D, Peralta M, Flôres F & Casanova N 2025. Factors influencing the
    accuracy of the repetition in reserve scale in resistance training: a systematic review.
    Physical Therapy Reviews 31(1):46–63. DOI 10.1080/10833196.2025.2564026.
  url: https://doi.org/10.1080/10833196.2025.2564026
  seeAlso: [http://hdl.handle.net/10174/39438]
  tag: SR
  status: active
  note: >-
    26 studies; qualitative synthesis: accuracy better near failure (especially upper-limb
    exercises), worse with more reps and lighter loads. No pooled error size. Closes EB §Gaps #26
    for the direction of the RIR bias; abstract and first page read (T-01, 2026-11-25).

- id: src.casanova2025
  citation: >-
    Casanova N, Gomes D, Russo F, Mateus J, Vieira A, Malcata G, Tenfen P, Soares D & Flôres F
    2025. Accuracy in predicting repetitions in reserve during resistance training: differences
    across load intensities, distance from muscular failure, sexes, and exercises. J Phys Educ
    Sport 25(11):2373–2381. DOI 10.7752/jpes.2025.11262.
  url: https://doi.org/10.7752/jpes.2025.11262
  tag: OBS
  status: active
  note: >-
    At loads of about 80% 1RM, true minus reported RIR was about +1.2 reps at a called RIR 3 and
    +0.1 to +0.65 at RIR 1; errors of 2–5 reps at 50% 1RM.

- id: src.martikainen2025
  citation: >-
    Martikainen O, Niiranen H, Rytkönen T, Schoenfeld BJ, Ahtiainen JP & Hulmi JJ 2025. Influence
    of varying proximity-to-failure on muscular adaptations and repetitions-in-reserve estimation
    accuracy in resistance-trained individuals. J Sci Sport Exerc (online ahead of print).
    DOI 10.1007/s42978-025-00338-8.
  url: https://doi.org/10.1007/s42978-025-00338-8
  tag: RCT-T
  status: active
  note: 'Baseline RIR error at a called RIR 3: squat +1.5 ± 1.7, bench +1.1 ± 1.8 reps.'

- id: src.lovegrove2022
  citation: >-
    Lovegrove S, Hughes LJ, Mansfield SK, Read PJ, Price P & Patterson SD 2022. Repetitions in
    reserve is a reliable tool for prescribing resistance training load. J Strength Cond Res
    36(10):2696–2700. DOI 10.1519/JSC.0000000000003952.
  url: https://pubmed.ncbi.nlm.nih.gov/36135029/
  tag: OBS
  status: active
  note: >-
    Novices; loads chosen for 1 RIR at 3, 5 and 8 reps: bench 93.0 / 87.3 / 79.6% and deadlift
    88.2 / 84.3 / 79.2% 1RM; between-session CV of the chosen load 2.7–6.2%.

- id: src.helms2016
  citation: >-
    Helms ER, Cronin J, Storey A & Zourdos MC 2016. Application of the repetitions in
    reserve-based rating of perceived exertion scale for resistance training. Strength Cond J
    38(4):42–49. DOI 10.1519/SSC.0000000000000218.
  url: https://doi.org/10.1519/SSC.0000000000000218
  seeAlso: [https://openrepository.aut.ac.nz/items/92cefeac-7c32-44f1-bfbc-f48f4a5dd8cf]
  tag: NARR
  status: active
  note: >-
    Table 2 is a %1RM-by-reps-and-RPE chart built from Zourdos 2016 squat data (three measured
