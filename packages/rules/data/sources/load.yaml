- id: src.nuzzo2024
  citation: >-
    Nuzzo, Pinto, Nosaka & Steele 2024. [Maximal repetitions at percentages of 1RM: meta-analysis
    of 269 studies, 952 tests, 7,289 people.] Sports Med 54:303–321. DOI 10.1007/s40279-023-01937-7.
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10933212
  tag: MA
  status: active
  note: >-
    The search was not systematic, 77 studies were digitised from figures, two authors formerly
    worked for an equipment company, and the leg-press confidence intervals are very wide.

- id: src.fitnessvolt-rts-chart
  citation: >-
    [The decimal RPE chart as commonly circulated as the RTS (Tuchscherer) chart: %1RM by reps and
    RPE, with the chart's caveats; secondary source.] FitnessVolt, "Tuchscherer chart explained".
  url: https://fitnessvolt.com/rpe-training/guides/tuchscherer-chart-explained
  tag: PRACT
  status: active
  note: >-
    The decimal chart as commonly circulated; Tuchscherer 2014 prints a different, lower chart
    (Beginning RTS: 5–8 points lower at 5–11 effective reps). No primary RTS publication of these
    decimal values was found, so POWR calls it the "RPE chart (common RTS version)", not
    Tuchscherer's original (T-01 evidence verification, 2026-11-25).

- id: src.marzagao2026
  citation: >-
