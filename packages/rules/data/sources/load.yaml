- id: src.marzagao2026
  citation: >-
    Marzagao 2026. [Weight-dependent 1RM formula fitted to 303,494 near-failure sets of app data
    (Fitbod), with a review of e1RM validation studies.] arXiv 2603.17495 (preprint).
  url: https://arxiv.org/pdf/2603.17495
  tag: PREPRINT
  status: active
  note: >-
    Industry author. The weight-dependent formula is not validated against measured 1RM and is not
    shipped (EB §Gaps #3); cited for within-person noise and set-order effects only.

