  url: https://arxiv.org/pdf/2603.17495
  tag: PREPRINT
  status: active
  note: >-
    Industry author. The weight-dependent formula is not validated against measured 1RM and is not
    shipped (EB §Gaps #3); cited for within-person noise and set-order effects only.

