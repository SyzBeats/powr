# Sources of the load, e1RM and change-detection parameters (data/load.yaml; EB "Effective reps
# turn any logged set into an e1RM" and "Consolidated default parameters › Load, e1RM and change
# detection"). Citations as complete as the EB report and its research note
# (load_intensity_1rm_rpe.md) give them; [bracketed] text describes a work whose title the EB does
# not give. Also holds POWR's own design documents cited across topics.

- id: src.mayhew2008
  citation: >-
    Mayhew et al. 2008. [Accuracy of 14 rep-max prediction equations: 103 college women, bench
    press, reps to fatigue at 60–90% 1RM, before and after 12 weeks of training.]
  url: https://pubmed.ncbi.nlm.nih.gov/18714230/
  seeAlso:
    - https://www.unm.edu/~rrobergs/478PredictionAccuracy.pdf
  tag: OBS
  status: active

- id: src.reynolds2006
  citation: >-
    Reynolds et al. 2006. [Prediction of 1RM from 5RM, 10RM and 20RM chest-press and leg-press
    tests in 70 adults aged 18–69; non-linear load–RM curve; "no more than 10 repetitions should be
    used".]
  url: https://www.unm.edu/~rrobergs/478RMStrengthPrediction.pdf
  tag: OBS
  status: active

- id: src.zourdos2016
