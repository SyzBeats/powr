# Sources of the load, e1RM and change-detection parameters (data/load.yaml; EB "Effective reps
# turn any logged set into an e1RM" and "Consolidated default parameters › Load, e1RM and change
# detection"). Citations as complete as the EB report and its research note
# (load_intensity_1rm_rpe.md) give them; [bracketed] text describes a work whose title the EB does
# not give. Also holds POWR's own design documents cited across topics.

- id: src.mayhew2008
  citation: >-
    Mayhew JL, Johnson BD, Lamonte MJ, Lauber D & Kemmler W 2008. Accuracy of prediction
    equations for determining one repetition maximum bench press in women before and after
    resistance training. J Strength Cond Res 22(5):1570–1577. DOI 10.1519/JSC.0b013e31817b02ad.
  url: https://pubmed.ncbi.nlm.nih.gov/18714230/
  seeAlso:
    - https://www.unm.edu/~rrobergs/478PredictionAccuracy.pdf
  tag: OBS
  status: active
  note: >-
    Accuracy of 14 rep-max prediction equations: 103 college women, bench press, reps to fatigue
    at 60–90% 1RM, before and after 12 weeks of training. Title completed by the T-01 evidence
    verification (2026-11-25).

