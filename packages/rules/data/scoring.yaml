# Powerlifting scores (EB §Scoring; §Defaults › Monitoring › Scoring display; PRD ANL-07). The
# formulas are implemented from the published definitions in @powr/domain/scoring; OPL source code
# is cited for values and test vectors only (LEG-08). IPF Points coefficients were cross-checked
# against the IPF formula document; since rules 1.8.0 (T-01 evidence verification, 2026-11-25)
# the Wilks, Wilks2020, DOTS and GL coefficients are checked against their primary or federation
# documents too (research_notes/Parameter verification/scoring.md), and GL follows the IPF
# document's bodyweight minimum by sex and its 6-decimal rounding. The other bodyweight clamps are
# an app implementation choice that follows OPL. Not shipped: OPL's single-lift IPF squat and
# deadlift constants (unknown origin, EB §Gaps #17).

- id: scoring.display
  value: { primary: [ipfGl, dots], legacy: [wilks, wilks2020], decimals: 2 }
  unit: none
  guard: { informal: Wilks or DOTS applied to a single squat or deadlift }
  evidence: [OFFICIAL, INF]
  sources: [src.opl-goodlift, src.powr-eb-scoring]
  ebRef: 'EB §Defaults › Monitoring (scoring display: IPF GL plus DOTS; Wilks/Wilks2020 legacy)'
  verified: true
  userOverridable: false

- id: scoring.wilks.coefficients
