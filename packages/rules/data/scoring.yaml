    male: [-216.0475144, 16.2606339, -0.002388645, -0.00113732, 7.01863e-6, -1.291e-8]
    female:
      [
        594.31747775582,
        -27.23842536447,
        0.82112226871,
        -0.00930733913,
        0.00004731582,
        -0.00000009054,
      ]
  unit: coefficients
  evidence: [OFFICIAL]
  sources: [src.kopayev2020, src.wilks2008, src.opl-wilks]
  ebRef: 'EB §Scoring › Wilks (coef = 500 / (a + b·x + … + f·x⁵))'
  verified: true
  userOverridable: false
  note: >-
    Ascending powers a…f. T-01 (2026-11-25): all 12 equal the polynomial in the IPF-hosted Kopayev
