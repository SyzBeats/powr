- id: scoring.ipfGl.minBodyweightKg
  value: { male: 40, female: 35 }
  unit: kg
  evidence: [OFFICIAL]
  sources: [src.ipf2020, src.opl-goodlift, src.powr-eb-scoring]
  ebRef: 'IPF 2020 GL document (Bwt ≥ 40 kg for men, ≥ 35 kg for women); EB §Scoring › IPF GL (0 below the minimum; floored at 0)'
  verified: true
  userOverridable: false
  note: >-
    Rules 1.8.0 (T-01 V-5, 2026-11-25): by sex, as the IPF GL document applies the formula, so men
    between 35 and 40 kg get no GL score, as at IPF meets. Rules up to 1.7.0 used 35 kg for both
    sexes, OpenPowerlifting's choice.

