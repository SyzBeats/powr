# Plan generation and validation (M2; PRD PLN-01…14; EB §Defaults › Volume, › Session). The volume
# bands, frequency, per-session caps, rep ranges and effort targets the generator uses live in
# volume.yaml; this table holds what only planning needs. Rows citing src.powr-prd carry product
# requirements; rows marked verified false are POWR design values where the EB and the PRD give
# only a direction.

- id: planning.mesocycle.accumulationWeeks
  value: { min: 3, max: 8 }
  unit: weeks
  evidence: [DELPHI/SURVEY, INF]
  sources: [src.powr-prd, src.rogerson2024, src.kassiano2022]
  ebRef: 'PRD PLN-08 (N accumulation weeks + 1 deload; default 4–6, user 3–8); EB §Defaults › Deloads, › Session (fixed within a 4–8-week mesocycle)'
  verified: true
  userOverridable: false
  note: 'The allowed range for a plan; the template states the default (5 weeks in every MVP template).'

- id: planning.novice.maxWorkingExercises
  value: 5
  unit: none
  evidence: [INF]
  sources: [src.powr-prd]
  ebRef: 'PRD PLN-02 (novices get ≤ 5 working exercises per session); technical concept §8.7.6 step 2'
  verified: true
  userOverridable: false

- id: planning.sessionBudget.tolerancePct
  value: 10
  unit: pct
  evidence: [INF]
  sources: [src.powr-prd]
  ebRef: 'PRD PLN-01 item 5 and PLN-14 (estimated duration within the budget with ≤ 10% tolerance)'
  verified: true
  userOverridable: false

- id: planning.slot.sets
  value: { min: 2, max: 5 }
  unit: sets
  evidence: [POS, INF]
  sources: [src.powr-prd, src.powr-eb-volume, src.acsm2026, src.acsm2009]
  ebRef: 'PRD PLN-07 examples (3 × 10, 5 × 3, 4 × 5, 3 × 8–12); EB §Defaults › Volume (weekly and per-session volume)'
  verified: true
  userOverridable: true
  note: >-
    The working sets one exercise slot gets per session. The EB sets weekly and per-session volume
    per muscle, not sets per exercise; more volume comes from more slots. T-01 (2026-11-25): the
    minimum of 2 is ACSM 2026's "at least two sets per exercise"; the maximum of 5 lies inside
    ACSM 2009's 3–6 sets per exercise for advanced hypertrophy training.

- id: planning.strength.accessorySets
  value: 3
  unit: sets
  evidence: [DELPHI/SURVEY, INF]
  sources: [src.androulakiskorakakis2021, src.powr-prd]
  ebRef: 'EB §Volume › Minimum and maintenance doses (powerlifting accessories 1–3 per lift at RPE 7–9, 6–10 reps); PRD PLN-07'
  verified: false
  userOverridable: true
  note: >-
    POWR design value: working sets of a powerlifting accessory slot (no muscle bands apply to
    them, PLN-03). T-01 (2026-11-25): the EB's "accessories 1–3 per lift" counts accessory
    exercises, not sets (Androulakis-Korakakis 2021); surveyed powerlifters did about 2–3 sets per
    accessory exercise a week, and ACSM 2026 advises at least two sets per exercise. 3 sets match
    when a slot comes once a week; no study sets the number.

- id: planning.volume.startPosition
  value: { novice: 0.2, intermediate: 0.5, advanced: 0.5, priority: 0.8 }
  unit: fraction
  evidence: [INF]
  sources: [src.powr-prd, src.powr-eb-volume]
  ebRef: 'PRD PLN-03 (novices in the lower part of the band, intermediate and advanced mid-band, priority muscles in the upper part); EB §Volume › Individual response'
  verified: false
  userOverridable: true
  note: >-
    Fractions of the way from the low to the high end of the default band (10–20 fractional sets
    per muscle, 4–10 heavy sets per lift): novice 12, intermediate and advanced 15, priority 18.
    The PRD names the parts of the band, not the numbers. T-01 (2026-11-25): all three
    hypertrophy starting points lie inside the evidence bands (ACSM 2026, Baz-Valle 2022);
    when recent volume is known, the 1.2× rule (volume.startingVolume.maxFactor) overrides this
    row. No study sets the positions.

- id: planning.rotation.perMuscle
  value: { min: 1, max: 2 }
  unit: none
  evidence: [SR, RCT-T, INF]
  sources: [src.kassiano2022, src.bazvalle2019, src.powr-eb-session]
  ebRef: 'EB §Defaults › Session (exercise rotation: fixed within a mesocycle; rotate 1–2 per muscle between mesocycles); PRD PLN-05, PLN-13'
  verified: true
  userOverridable: true

- id: planning.variety.pool
  value: 3
  unit: none
  evidence: [INF]
  sources: [src.bazvalle2019, src.powr-technical-concept]
  ebRef: 'EB §Session › Exercise selection (random variation only as opt-in); technical concept §8.7.1 (seeded variety mode)'
  verified: false
  userOverridable: true
  note: >-
    POWR design value: variety mode picks among the best N candidates of a slot with the plan
    seed. T-01 (2026-11-25): some systematic variation helps and excessive random variation may
    not (Kassiano 2022); app-chosen random exercises gave equal gains (Baz-Valle 2019); no study
    gives a pool size.

- id: planning.missed.mergePriorities
  value: [primary]
  unit: none
  evidence: [INF]
  sources: [src.powr-prd]
  ebRef: 'PRD PLN-11 (merge key work of a missed session into the next session; never drop planned work silently)'
  verified: false
  userOverridable: true
  note: >-
    POWR reading of "key work": the primary slots; the per-session caps still apply. T-01
    (2026-11-25): no study addresses which work to move after a missed session; the strength
    effect of a lift's frequency (Pelland 2026) supports keeping the main lifts.

- id: planning.timeBudget.fallback
  value: { keepFull: [priorities, template], templateSlots: [primary] }
  unit: none
  evidence: [INF, RCT, NARR]
  sources: [src.powr-prd, src.iversen2021, src.bickel2011, src.spiering2021]
  ebRef: 'PRD PLN-03 (priority muscles in the upper part of the band, de-prioritized muscles at the floor or maintenance level) and PLN-14 (time budget); EB §Volume › Minimum and maintenance doses; §Session › Session duration and time-cap mode'
  verified: true
  userOverridable: false
  note: >-
    PRD PLN-14: "the user's priority muscles keep their full target … Without priorities, the
    muscles the template emphasises keep theirs" (product-owner decision, M2b); verified as the
    PRD's own rule (T-01, 2026-11-25), its evidence label stays "App estimate". The fallback dose
    is supported: about 4 weekly sets (Iversen 2021); strength and size are kept for months with a
    third of the volume (Bickel 2011) or less if the load is kept (Spiering 2021). When the
    session time budget cannot fit
    every weekly target, the first non-empty group in keepFull keeps its full target: the user's
    priority muscles, else the template's emphasis (the display groups its hypertrophy slots of a
    templateSlots priority target). Every other muscle falls back towards
    volume.hypertrophy.minimumDose; the plan says so and suggests more minutes per session or
    another training day.
