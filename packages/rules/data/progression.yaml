# Progression and autoregulation (EB §Defaults › Progression; EB §Progression). Not in the registry:
# velocity-based training (MVT priors, velocity-loss presets, velocity readiness, load–velocity 1RM
# prediction): out of scope (PRD NG-06) and unvalidated on Android (EB §Gaps #12–13).

- id: progression.model.mainLift
  value: { novice: linear, intermediate: rpe, advanced: rpe }
  unit: none
  guard: { presets: [apre] }
  evidence: [RCT-T, MA]
  sources: [src.helms2018, src.zhang2021]
  ebRef: 'EB §Defaults › Progression (main-lift progression; fixed % for beginners); PRD PRG-05, PRG-06'
  verified: true
  userOverridable: true

- id: progression.model.accessory
