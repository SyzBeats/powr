# Bodyweight trend (EB §Nutrition › Trend smoothing; §Defaults › Nutrition › Weight trend; PRD
# BOD-02). The rest of the nutrition parameters (protein, rates, RMR equations, guardrails) are v1.2
# and will get their own table; the E-5 equations will ship blockedUntilVerified there.

- id: bodyweight.trend.alphaPerDay
  value: 0.1
  unit: fraction
  range: { min: 0.05, max: 0.15 }
  guard: { cutting: { min: 0.1, max: 0.15 }, slowBulk: { min: 0.05, max: 0.1 } }
  evidence: [PRACT, OBS]
  sources: [src.fourmilab-hackdiet, src.khosla1964, src.powr-eb-nutrition]
  ebRef: 'EB §Defaults › Nutrition (weight trend: daily EMA α 0.1); §Nutrition › Trend smoothing'
  verified: true
  userOverridable: true
  note: 'Missed days use α_eff = 1 − (1 − α)^Δdays. No smoothing parameter is validated (§Gaps #20).'

- id: bodyweight.trend.initialWeighIns
  value: { min: 3, max: 7 }
  unit: mixed
  evidence: [INF]
  sources: [src.powr-eb-nutrition]
  ebRef: 'EB §Nutrition › Trend smoothing (init = mean of the first 3–7 weigh-ins)'
  verified: true
  userOverridable: false
  note: 'The trend appears after 3 weigh-ins as their running mean and becomes an EMA after 7.'

- id: bodyweight.trend.winsorizePct
  value: 2.5
  unit: pct
  range: { min: 2, max: 2.5 }
  evidence: [OBS, INF]
  sources: [src.khosla1964, src.orsama2014, src.powr-eb-nutrition]
  ebRef: 'EB §Nutrition › Trend smoothing (winsorise readings > ~2–2.5% from trend)'
  verified: true
  userOverridable: false

- id: bodyweight.rate.windowDays
  value: { min: 21, max: 28 }
  unit: days
  evidence: [INF]
  sources: [src.powr-eb-nutrition]
  ebRef: 'EB §Nutrition › Trend smoothing (rate = regression slope over the last 14–28 days); PRD BOD-02'
  verified: true
  userOverridable: false
  note: >-
    The slope uses the readings of the last 28 days and needs them to span at least 21 days;
    until then the app says "not enough data yet". Rules 1.8.0 (T-01, product-owner decision
    2026-11-25; was 14): with a day-to-day SD of about 0.5% around the trend, the slope's standard
    error is about 0.23%/week over 14 days, about the half-width of the ±0.25% maintain band, but
    about 0.13%/week over 21 days and 0.08%/week over 28 [INF]. 21 is the start of the 21–28 days
    the evidence verification recommended and stays inside the EB's 14–28-day window.

# M4a (rules 1.5.0): the weekly rate against the phase (BOD-02 "the weekly rate with its band").
# Rates are % of bodyweight per week; the cut's are losses. Never derived from a single day.

- id: bodyweight.rate.bulk
  value:
    target:
      novice: { min: 0.25, max: 0.5 }
      intermediate: { min: 0.25, max: 0.5 }
      advanced: { min: 0.1, max: 0.25 }
    sustainedWeeks: 3
  unit: pctPerWeek
  evidence: [NARR, RCT-T, INF]
  sources: [src.iraki2019, src.powr-eb-nutrition]
  ebRef: 'EB §Nutrition › Bulking (gain 0.25–0.5% BW/week for novices and intermediates, less for advanced; warn above the band for ≥ 3 weeks); §Defaults › Nutrition (bulk rate)'
  verified: true
  userOverridable: true
  note: 'The EB names novice 0.5 %/week as the target and 0.25–0.5 % for novices and intermediates (Iraki 2019); the band uses that range.'

- id: bodyweight.rate.cut
  value:
    target: { min: 0.5, max: 0.7 }
    allowed: { min: 0.25, max: 1.0 }
    hardWarnAbove: 1.0
    sustainedWeeks: 2
  unit: pctPerWeek
  evidence: [NARR, RCT]
  sources: [src.helms2014, src.garthe2011, src.powr-eb-nutrition]
  ebRef: 'EB §Nutrition › Cutting (default 0.5–0.7% BW/week; allowed 0.25–1.0%; hard warning above 1.0%/week sustained for ≥ 2 weeks); §Defaults › Nutrition (cut rate)'
  verified: true
  userOverridable: true

- id: bodyweight.rate.maintain
  value: { min: -0.25, max: 0.25 }
  unit: pctPerWeek
  evidence: [INF]
  sources: [src.powr-prd, src.powr-eb-nutrition]
  ebRef: 'PRD BOD-02 v0.7 ("When maintaining, the rate band shown is ±0.25 %BW/week"); EB §Nutrition › Trend smoothing (no maintenance band in the EB)'
  verified: true
  userOverridable: true
  note: >-
    The PRD's number (BOD-02 v0.7, approved 2026-11-25): a trend within ±0.25 % of bodyweight per
    week reads as maintaining; verified as the PRD's own number (T-01, 2026-11-25), its evidence
    label stays "App estimate". It is half the slowest cut target (0.5 %/week); the advanced bulk
    band (0.1–0.25 %/week) lies inside it, which does not matter because a band applies only to
    the selected phase. No study defines a short-term maintaining rate (long-term maintenance is
    < 3 % of bodyweight, Stevens 2006).
