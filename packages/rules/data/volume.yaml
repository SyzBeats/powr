# Volume, frequency, load and effort (EB §Defaults › Volume; EB §Volume). Rules 1.8.0 (T-01
# evidence verification, 2026-11-25): the weekly bands, set counting, strength frequency, the
# strength per-session sets and the RIR slope are checked against Pelland Sports Med 2026 (published
# abstract and its OSF data), ACSM 2026 and the Robinson accepted manuscript and ship verified. The
# Pelland tiers and the PUOS stay verified false until the published full text (Tables 2A/2B) is
# read; the Remmert per-session cap stays a preprint value (E-2, EB §Gaps #1). The RP landmarks
# (MV/MEV/MAV/MRV) are a coaching overlay for M4 and are not registry defaults.

- id: volume.hypertrophy.weeklyBands
  value: { floor: 4, defaultLow: 10, defaultHigh: 20, highHigh: 30, hardWarnAbove: 40 }
  unit: sets
  guard: { softWarningAbove: 30, softText: no detectable superiority, hardText: almost no data }
  evidence: [MA, POS]
  sources: [src.pelland2026, src.acsm2026, src.bazvalle2022, src.powr-eb-volume]
  ebRef: 'EB §Defaults › Volume (hypertrophy weekly sets per muscle, fractional); §Volume › About 4 sets'
  verified: true
  userOverridable: false
  note: >-
    Fractional sets per muscle per week: floor 4, default 10–20, high band 20–30 (an individual
    experiment), soft warning above 30, hard warning above 40. T-01 (2026-11-25): 4 vs 0 sets
    +2.21% (Pelland 2026 data); ACSM 2026 "≥ 10 sets/wk" and diminishing returns beyond about
    18–20; Baz-Valle 2022 12–20; the PUOS is 31; only one study in Pelland's dataset tested more
    than 40 sets (45), hence "almost no data".

- id: volume.hypertrophy.tiers
  value:
    - { minSets: 4, maxSets: 4, tier: minimumEffectiveDose, extraSetsPerDetectableGain: null }
    - { minSets: 5, maxSets: 10, tier: higherEfficiency, extraSetsPerDetectableGain: 6 }
    - { minSets: 11, maxSets: 18, tier: intermediateEfficiency, extraSetsPerDetectableGain: 8.5 }
    - { minSets: 19, maxSets: 29, tier: lowerEfficiency, extraSetsPerDetectableGain: 10.75 }
    - { minSets: 30, maxSets: 42, tier: lowestEfficiency, extraSetsPerDetectableGain: 12.5 }
    - { minSets: 43, maxSets: null, tier: unclear, extraSetsPerDetectableGain: null }
  unit: table
  evidence: [MA, PREPRINT]
  sources: [src.pelland2026, src.pelland2024]
  ebRef: 'EB §Volume › About 4 sets per week is detectable (hypertrophy efficiency tiers; SDES 2.05%)'
  verified: false
  userOverridable: false
  note: >-
    Reproduced from the published paper's supplementary data (OSF): MED 4 and SDES 2.05%; extra
    sets per detectable gain about 5.8 / 8.1 / 10.6 / 13.1, within the registry's precision. The
    tier table itself was read in the preprint; it stays verified false until the published Table
    2A is read (product-owner decision, T-01, 2026-11-25).

- id: volume.strength.tiers
  value:
    - { minSets: 1, maxSets: 1, tier: minimumEffectiveDose, extraSetsPerDetectableGain: null }
    - { minSets: 2, maxSets: 2, tier: lowerEfficiency, extraSetsPerDetectableGain: 12 }
    - { minSets: 3, maxSets: null, tier: notDetectable, extraSetsPerDetectableGain: null }
  unit: table
  evidence: [MA, INF]
  sources: [src.pelland2026]
  ebRef: 'EB §Volume › About 4 sets per week is detectable (strength tiers; SDES 3.96%)'
  verified: false
  userOverridable: false
  note: >-
    Rules 1.8.0 (T-01 V-2, 2026-11-25): recomputed from the published paper's supplementary data
    (OSF). From 1 set, 3 more give a detectable gain (P 83.6%); from 2 sets, 12 more (P 52.3%);
    from 3 sets, no higher volume up to 32 sets does (best P 3.6%), which agrees with the PUOS of
    3. The preprint's 0.75 and 2.25 and its "not detectable from 5" could not be reproduced.
    Gains continue below the detection threshold (10 vs 3 sets: +2.63%). Stays verified false
    until the published Table 2B is read: the table is POWR's recomputation.

- id: volume.puos
  value: { hypertrophyFractionalSets: 31, strengthFractionalSets: 3, strengthSessionsPerWeek: 3 }
  unit: mixed
  evidence: [MA, PREPRINT]
  sources: [src.pelland2026, src.remmert2025, src.pelland2024]
  ebRef: 'EB §Volume › About 4 sets per week (point of undetectable outcome superiority); §Volume › Frequency'
  verified: false
  userOverridable: false
  note: >-
    The authors stress these are not upper limits; more sets still add gains, just not
    detectably. T-01 (2026-11-25): all three values reproduce from the published paper's data (30
    → 45 sets 61.7%, 31 → 45 46.9%; 2 → 14 sets 52.3%, 3 → 32 3.6%; 2 → 5 sessions 61.85%, 3 → 6
    0.0%); the hypertrophy 31 is partly set by the end of the comparison grid (45 sets), and the
    term comes from the Remmert preprint. Stays verified false until the published full text is
    read (product-owner decision).

- id: volume.counting.default
  value: fractional
  unit: none
  evidence: [MA]
  sources: [src.pelland2026]
  ebRef: 'EB §Defaults › Volume (set counting: primary 1.0, synergist 0.5; show direct and fractional)'
  verified: true
  userOverridable: true
  note: >-
    Both counts are always computed; this picks the default display. The published abstract keeps
    the conclusion: "The relative evidence for the 'fractional' quantification method was
    strongest"; the OSF sensitivity plots put the best synergist weight at about 0.38–0.40, and
    0.5 fits within about 0.1% of it (T-01, 2026-11-25).

