  verified: true
  userOverridable: true
  note: 'A way to distribute volume; at equal volume the frequency is personal preference.'

- id: volume.frequency.strengthPerLift
  value: { min: 2, max: 3 }
  unit: sessions
  evidence: [MA, POS, DELPHI/SURVEY]
  sources: [src.pelland2026, src.acsm2026, src.androulakiskorakakis2021]
  ebRef: 'EB §Defaults › Volume (frequency, strength 2–3 sessions per lift per week)'
  verified: true
  userOverridable: true
  note: >-
    T-01 (2026-11-25): frequency has an independent strength effect with diminishing returns
    (Pelland 2026: 1 → 2 sessions +4.07%, 2 → 3 +2.02%, nothing detectable beyond 3); ACSM 2026
    "≥ 2 sessions/wk"; powerlifters spread their sets across 1–3 sessions a week.

- id: volume.hypertrophy.perSessionSoftCap
  value: { fractionalSets: 11, directSets: 8, nudge: { min: 10, max: 12 } }
  unit: sets
  evidence: [PREPRINT]
  sources: [src.remmert2025]
  ebRef: 'EB §Defaults › Volume (per-session cap, hypertrophy); §Volume › Per-session returns'
  verified: false
  userOverridable: true
  note: >-
    Above the cap the planner suggests another session; never present "junk volume" as fact. T-01
    (2026-11-25): no peer-reviewed Remmert paper exists yet (only the preprint and two conference
    abstracts, MSSE 58(10S), 2026), and few data lie above the cap. A design value until the
    peer-reviewed paper appears (E-2).

- id: volume.strength.perSessionHeavySets
  value: { min: 2, max: 3 }
  unit: sets
  evidence: [POS, DELPHI/SURVEY]
  sources: [src.acsm2026, src.androulakiskorakakis2021]
  ebRef: 'EB §Defaults › Volume (per-session cap, strength ~2–3 direct heavy sets per lift)'
  verified: true
  userOverridable: true
  note: >-
    T-01 (2026-11-25): ACSM 2026 Table 6 "Volume: 2–3 sets/session" for strength ("at least two
    sets per exercise … these benefits diminish with each subsequent set"); 2–3 back-off sets after
    a top single (Androulakis-Korakakis 2021). ACSM's figure is per exercise in general strength
    training, not specifically heavy sets of a competition lift.

- id: volume.strength.weeklyHeavySetsPerLift
  value: { min: 4, max: 10 }
  unit: sets
  guard: { minimumDose: { min: 3, max: 6 }, plateauAbove: 3 }
  evidence: [MA, DELPHI/SURVEY]
  sources: [src.androulakiskorakakis2021, src.pelland2026]
  ebRef: 'EB §Defaults › Volume (strength sets per competition lift per week)'
  verified: false
  userOverridable: true
  note: >-
    Rules 1.8.0 (T-01 V-3, 2026-11-25): no detectable superiority above about 3 fractional sets a
    week (Pelland 2026 data); gains continue below the detection threshold. The former 5 came from
    the preprint's tier label. The minimum dose 3–6 is Androulakis-Korakakis 2021; the band 4–10
    stays a design value (Pelland counts fractional sets of the tested lift, POWR direct sets at
    ≥ 80% 1RM; surveyed powerlifters use about 4–8).

