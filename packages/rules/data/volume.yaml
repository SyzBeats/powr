# Volume, frequency, load and effort (EB §Defaults › Volume; EB §Volume). The Pelland tiers, the
# PUOS and the Remmert per-session caps come from preprints and ship with verified false (E-2,
# EB §Gaps #1): recheck against Pelland Sports Med 2026 and the published Remmert paper. The RP
# landmarks (MV/MEV/MAV/MRV) are a coaching overlay for M4 and are not registry defaults.

- id: volume.hypertrophy.weeklyBands
  value: { floor: 4, defaultLow: 10, defaultHigh: 20, highHigh: 30, hardWarnAbove: 40 }
  unit: sets
  guard: { softWarningAbove: 30, softText: no detectable superiority, hardText: no data }
  evidence: [MA, PREPRINT]
  sources: [src.pelland2026, src.pelland2024, src.bazvalle2022, src.acsm2026, src.powr-eb-volume]
  ebRef: 'EB §Defaults › Volume (hypertrophy weekly sets per muscle, fractional); §Volume › About 4 sets'
  verified: false
  userOverridable: false
  note: >-
    Fractional sets per muscle per week: floor 4, default 10–20, high band 20–30 (an individual
    experiment), soft warning above 30, hard warning above 40.

- id: volume.hypertrophy.tiers
  value:
    - { minSets: 4, maxSets: 4, tier: minimumEffectiveDose, extraSetsPerDetectableGain: null }
    - { minSets: 5, maxSets: 10, tier: higherEfficiency, extraSetsPerDetectableGain: 6 }
    - { minSets: 11, maxSets: 18, tier: intermediateEfficiency, extraSetsPerDetectableGain: 8.5 }
    - { minSets: 19, maxSets: 29, tier: lowerEfficiency, extraSetsPerDetectableGain: 10.75 }
    - { minSets: 30, maxSets: 42, tier: lowestEfficiency, extraSetsPerDetectableGain: 12.5 }
    - { minSets: 43, maxSets: null, tier: unclear, extraSetsPerDetectableGain: null }
  unit: table
  evidence: [PREPRINT]
  sources: [src.pelland2024]
  ebRef: 'EB §Volume › About 4 sets per week is detectable (hypertrophy efficiency tiers; SDES 2.05%)'
  verified: false
  userOverridable: false

- id: volume.strength.tiers
  value:
    - { minSets: 1, maxSets: 1, tier: minimumEffectiveDose, extraSetsPerDetectableGain: null }
    - { minSets: 2, maxSets: 2, tier: higherEfficiency, extraSetsPerDetectableGain: 0.75 }
    - { minSets: 3, maxSets: 4, tier: intermediateEfficiency, extraSetsPerDetectableGain: 2.25 }
    - { minSets: 5, maxSets: null, tier: notDetectable, extraSetsPerDetectableGain: null }
  unit: table
  evidence: [PREPRINT]
  sources: [src.pelland2024]
  ebRef: 'EB §Volume › About 4 sets per week is detectable (strength tiers; SDES 3.96%)'
  verified: false
  userOverridable: false

- id: volume.puos
  value: { hypertrophyFractionalSets: 31, strengthFractionalSets: 3, strengthSessionsPerWeek: 3 }
  unit: mixed
  evidence: [PREPRINT]
  sources: [src.remmert2025, src.pelland2024]
  ebRef: 'EB §Volume › About 4 sets per week (point of undetectable outcome superiority); §Volume › Frequency'
  verified: false
  userOverridable: false
  note: 'The authors stress these are not upper limits; more sets still add gains, just not detectably.'

- id: volume.counting.default
  value: fractional
  unit: none
  evidence: [MA]
  sources: [src.pelland2024, src.pelland2026]
  ebRef: 'EB §Defaults › Volume (set counting: primary 1.0, synergist 0.5; show direct and fractional)'
  verified: false
  userOverridable: true
  note: >-
    Both counts are always computed; this picks the default display. Whether the published Pelland
    version changed the fractional-counting conclusion is not verified (E-2).

