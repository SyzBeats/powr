# Bodybuilding, 4 days: full body ×4, an alternative to upper/lower ×2 (TD-37; a POWR addition,
# PLN-02 names only upper/lower for this cell). See bb-full-body-3day.yaml for how slots work.
# Every major muscle has a slot on at least two of the four days (PLN-04); the sessions are
# shorter than the upper/lower days because each one trains the whole body with fewer exercises.

id: tpl.bb-full-body-4day
name: { en: Full body ×4 }
description:
  en: Four full-body sessions a week. Each muscle is trained on two or three days, with fewer exercises per session than an upper/lower split.
style: bodybuilding
daysPerWeek: 4
split: fullBody
levels: [novice, intermediate, advanced]
default: false
periodization: linear
progression: { main: doubleProgression, accessory: doubleProgression, novice: doubleProgression }
mesocycle: { accumulationWeeks: 5, deloadWeeks: 1, deloadRule: deload.content }
days:
  - key: a
    name: { en: Full body A }
    slots:
      - key: a.squat
        pattern: squat
        targets: [mu.quads, mu.glutes]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.chest
        pattern: horizontalPush
        targets: [mu.chest]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.row
        pattern: horizontalPull
        targets: [mu.lats, mu.mid-back]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.lateral-raise
        pattern: shoulderAbduction
        targets: [mu.side-delts]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.curl
        pattern: elbowFlexion
        targets: [mu.elbow-flexors]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
      - key: a.calf
        pattern: calf
        targets: [mu.calves]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression

  - key: b
    name: { en: Full body B }
    slots:
      - key: b.hinge
        pattern: hinge
        targets: [mu.hamstrings, mu.glutes]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.press
        pattern: verticalPush
        targets: [mu.front-delts]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.pulldown
        pattern: verticalPull
        targets: [mu.lats]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.triceps
        pattern: elbowExtension
        targets: [mu.triceps.long-head]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.rear-delts
        pattern: shoulderHorizontalAbduction
        targets: [mu.rear-delts]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
      - key: b.abs
        pattern: core
        targets: [mu.abs]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression

  - key: c
    name: { en: Full body C }
    slots:
      - key: c.lunge
        pattern: lunge
        targets: [mu.quads, mu.glutes]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: c.incline
        pattern: horizontalPush
        targets: [mu.chest.clavicular, mu.front-delts]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: c.row
        pattern: horizontalPull
        targets: [mu.mid-back, mu.rear-delts]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: c.leg-curl
        pattern: kneeFlexion
        targets: [mu.hamstrings]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: c.curl
        pattern: elbowFlexion
        targets: [mu.elbow-flexors]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
      - key: c.calf
        pattern: calf
        targets: [mu.calves]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression

  - key: d
    name: { en: Full body D }
    slots:
      - key: d.hip-thrust
        pattern: hipExtension
        targets: [mu.glutes]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: d.pulldown
        pattern: verticalPull
        targets: [mu.lats]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: d.dip
        pattern: verticalPush
        targets: [mu.chest, mu.triceps]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: d.leg-extension
        pattern: kneeExtension
        targets: [mu.quads]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: d.lateral-raise
        pattern: shoulderAbduction
        targets: [mu.side-delts]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: d.triceps
        pattern: elbowExtension
        targets: [mu.triceps.lateral-medial]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
