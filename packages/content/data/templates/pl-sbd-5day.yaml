# Powerlifting, 5 days: SBD 5-day (PLN-02; TD-24, M2). Squat and bench three times a week, deadlift
# twice (PLN-04: 2–3), each lift undulating between heavy, moderate and light days; the fifth day
# carries upper-back, shoulder and arm accessories. See pl-sbd-3day.yaml for the stated targets.

id: tpl.pl-sbd-5day
name: { en: 'SBD 5-day' }
description:
  en: 'Five workouts with squat and bench press three times and deadlift twice a week, plus accessory work for the upper back and arms.'
style: powerlifting
daysPerWeek: 5
split: sbd
levels: [intermediate, advanced]
default: true
periodization: block
progression: { main: rpe, accessory: doubleProgression, novice: linear }
mesocycle: { accumulationWeeks: 5, deloadWeeks: 1, deloadRule: deload.content }
days:
  - key: squat-heavy
    name: { en: 'Heavy squat, light bench' }
    slots:
      - key: squat-heavy.squat
        pattern: squat
        targets: [mu.quads]
        priority: primary
        lift: squat
        intensity: heavy
        goal: strength
        mode: topBackoff
        repRange: [1, 3]
        effort: { rpe: [8, 9] }
        backoff: { repRange: [3, 5], effort: { rpe: [7, 8] } }
      - key: squat-heavy.bench
        pattern: horizontalPush
        targets: [mu.chest]
        priority: primary
        lift: bench
        allowVariants: true
        intensity: light
        goal: strength
        mode: rpe
        repRange: [4, 6]
        effort: { rpe: [6, 7] }
      - key: squat-heavy.row
        pattern: horizontalPull
        targets: [mu.lats, mu.mid-back]
        priority: secondary
        goal: strength
        mode: doubleProgression
      - key: squat-heavy.abs
        pattern: core
        targets: [mu.abs]
        priority: optional
        goal: strength
        mode: doubleProgression

  - key: deadlift-heavy
    name: { en: 'Heavy deadlift' }
    slots:
      - key: deadlift-heavy.deadlift
        pattern: hinge
        targets: [mu.glutes, mu.lower-back]
        priority: primary
        lift: deadlift
        intensity: heavy
        goal: strength
        mode: topBackoff
        repRange: [1, 3]
        effort: { rpe: [8, 9] }
        backoff: { repRange: [3, 5], effort: { rpe: [7, 8] } }
      - key: deadlift-heavy.press
        pattern: verticalPush
        targets: [mu.front-delts]
        priority: secondary
        goal: strength
        mode: doubleProgression
      - key: deadlift-heavy.pulldown
        pattern: verticalPull
        targets: [mu.lats]
        priority: secondary
        goal: strength
        mode: doubleProgression
      - key: deadlift-heavy.leg-curl
        pattern: kneeFlexion
        targets: [mu.hamstrings]
        priority: optional
        goal: strength
        mode: doubleProgression

  - key: bench-heavy
    name: { en: 'Heavy bench, light squat' }
    slots:
      - key: bench-heavy.bench
        pattern: horizontalPush
        targets: [mu.chest]
        priority: primary
        lift: bench
        intensity: heavy
        goal: strength
        mode: topBackoff
        repRange: [1, 3]
        effort: { rpe: [8, 9] }
        backoff: { repRange: [3, 5], effort: { rpe: [7, 8] } }
      - key: bench-heavy.squat
        pattern: squat
        targets: [mu.quads]
        priority: secondary
        lift: squat
        allowVariants: true
        intensity: light
        goal: strength
        mode: rpe
        repRange: [3, 5]
        effort: { rpe: [6, 7] }
      - key: bench-heavy.rear-delts
        pattern: shoulderHorizontalAbduction
        targets: [mu.rear-delts]
        priority: optional
        goal: strength
        mode: doubleProgression
      - key: bench-heavy.triceps
        pattern: elbowExtension
        targets: [mu.triceps]
        priority: optional
        goal: strength
        mode: doubleProgression

  - key: squat-moderate
    name: { en: 'Moderate squat, deadlift variant' }
    slots:
      - key: squat-moderate.squat
        pattern: squat
        targets: [mu.quads]
        priority: primary
        lift: squat
        intensity: moderate
        goal: strength
        mode: rpe
        repRange: [3, 5]
        effort: { rpe: [7, 8] }
      - key: squat-moderate.deadlift
        pattern: hinge
        targets: [mu.glutes, mu.lower-back]
        priority: secondary
        lift: deadlift
        allowVariants: true
        intensity: light
        goal: strength
        mode: rpe
        repRange: [3, 5]
        effort: { rpe: [6, 7] }
      - key: squat-moderate.row
        pattern: horizontalPull
        targets: [mu.mid-back, mu.rear-delts]
        priority: secondary
        goal: strength
        mode: doubleProgression
      - key: squat-moderate.abs
        pattern: core
        targets: [mu.abs, mu.obliques]
        priority: optional
        goal: strength
        mode: doubleProgression

  - key: bench-moderate
    name: { en: 'Moderate bench and accessories' }
    slots:
      - key: bench-moderate.bench
        pattern: horizontalPush
        targets: [mu.chest]
        priority: primary
        lift: bench
        intensity: moderate
        goal: strength
        mode: rpe
        repRange: [3, 5]
        effort: { rpe: [7, 8] }
      - key: bench-moderate.triceps
        pattern: elbowExtension
        targets: [mu.triceps]
        priority: secondary
        goal: strength
        mode: doubleProgression
      - key: bench-moderate.pulldown
        pattern: verticalPull
        targets: [mu.lats]
        priority: secondary
        goal: strength
        mode: doubleProgression
      - key: bench-moderate.curl
        pattern: elbowFlexion
        targets: [mu.elbow-flexors]
        priority: optional
        goal: strength
        mode: doubleProgression
