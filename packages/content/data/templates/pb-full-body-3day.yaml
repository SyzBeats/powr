# Powerbuilding, 3 days: full body ×3 (PLN-02; TD-24, M2). Each competition lift twice a week
# (PLN-04), once heavy and once lighter or as a close variant, followed by hypertrophy work; see
# pb-upper-lower-4day.yaml for the stated strength targets.

id: tpl.pb-full-body-3day
name: { en: 'Full body ×3 (strength and size)' }
description:
  en: 'Three full-body workouts a week: each competition lift twice, heavy and light, with hypertrophy work in every workout.'
style: powerbuilding
daysPerWeek: 3
split: fullBody
levels: [novice, intermediate, advanced]
default: true
periodization: dailyUndulating
progression: { main: rpe, accessory: doubleProgression, novice: linear }
mesocycle: { accumulationWeeks: 5, deloadWeeks: 1, deloadRule: deload.content }
days:
  - key: a
    name: { en: 'Heavy squat' }
    slots:
      - key: a.squat
        pattern: squat
        targets: [mu.quads]
        priority: primary
        lift: squat
        intensity: heavy
        goal: strength
        mode: topBackoff
        repRange: [2, 4]
        effort: { rpe: [8, 9] }
        backoff: { repRange: [4, 6], effort: { rpe: [7, 8] } }
      - key: a.bench
        pattern: horizontalPush
        targets: [mu.chest]
        priority: primary
        lift: bench
        allowVariants: true
        intensity: moderate
        goal: strength
        mode: rpe
        repRange: [4, 6]
        effort: { rpe: [7, 8] }
      - key: a.row
        pattern: horizontalPull
        targets: [mu.lats, mu.mid-back]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.lateral-raise
        pattern: shoulderAbduction
        targets: [mu.side-delts]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.curl
        pattern: elbowFlexion
        targets: [mu.elbow-flexors]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression

  - key: b
    name: { en: 'Heavy deadlift and bench' }
    slots:
      - key: b.deadlift
        pattern: hinge
        targets: [mu.glutes, mu.lower-back]
        priority: primary
        lift: deadlift
        intensity: heavy
        goal: strength
        mode: topBackoff
        repRange: [2, 4]
        effort: { rpe: [8, 9] }
        backoff: { repRange: [4, 6], effort: { rpe: [7, 8] } }
      - key: b.bench
        pattern: horizontalPush
        targets: [mu.chest]
        priority: primary
        lift: bench
        intensity: heavy
        goal: strength
        mode: topBackoff
        repRange: [2, 4]
        effort: { rpe: [8, 9] }
        backoff: { repRange: [4, 6], effort: { rpe: [7, 8] } }
      - key: b.pulldown
        pattern: verticalPull
        targets: [mu.lats]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.leg-curl
        pattern: kneeFlexion
        targets: [mu.hamstrings]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.triceps
        pattern: elbowExtension
        targets: [mu.triceps.long-head]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression

  - key: c
    name: { en: 'Light squat and deadlift, hypertrophy' }
    slots:
      - key: c.squat
        pattern: squat
        targets: [mu.quads]
        priority: secondary
        lift: squat
        allowVariants: true
        intensity: light
        goal: strength
        mode: rpe
        repRange: [3, 5]
        effort: { rpe: [6, 7] }
      - key: c.deadlift
        pattern: hinge
        targets: [mu.glutes, mu.lower-back]
        priority: secondary
        lift: deadlift
        allowVariants: true
        intensity: light
        goal: strength
        mode: rpe
        repRange: [3, 5]
        effort: { rpe: [6, 7] }
      - key: c.incline
        pattern: horizontalPush
        targets: [mu.chest.clavicular, mu.front-delts]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: c.row
        pattern: horizontalPull
        targets: [mu.mid-back, mu.rear-delts]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: c.calf
        pattern: calf
        targets: [mu.calves]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
