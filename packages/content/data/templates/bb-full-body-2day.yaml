# Bodybuilding, 2 days: full body ×2 (PLN-02; TD-24, M2). See bb-full-body-3day.yaml for how slots
# work. With two sessions a week each major muscle has a slot in both or, for the arms, shoulders
# and calves, a slot that the other day's compounds back up; the ≥ 2-sessions rule (PLN-04) applies
# from three days a week.

id: tpl.bb-full-body-2day
name: { en: 'Full body ×2' }
description:
  en: 'Two full-body workouts a week, each with a squat or hinge, a press, a pull and isolation work.'
style: bodybuilding
daysPerWeek: 2
split: fullBody
levels: [novice, intermediate, advanced]
default: true
periodization: linear
progression: { main: doubleProgression, accessory: doubleProgression, novice: doubleProgression }
mesocycle: { accumulationWeeks: 5, deloadWeeks: 1, deloadRule: deload.content }
days:
  - key: a
    name: { en: 'Full body A' }
    slots:
      - key: a.squat
        pattern: squat
        targets: [mu.quads, mu.glutes]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.chest
        pattern: horizontalPush
        targets: [mu.chest]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.row
        pattern: horizontalPull
        targets: [mu.lats, mu.mid-back]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.leg-curl
        pattern: kneeFlexion
        targets: [mu.hamstrings]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.lateral-raise
        pattern: shoulderAbduction
        targets: [mu.side-delts]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.curl
        pattern: elbowFlexion
        targets: [mu.elbow-flexors]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: a.triceps
        pattern: elbowExtension
        targets: [mu.triceps.long-head]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
      - key: a.calf
        pattern: calf
        targets: [mu.calves]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression

  - key: b
    name: { en: 'Full body B' }
    slots:
      - key: b.hinge
        pattern: hinge
        targets: [mu.hamstrings, mu.glutes]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.incline
        pattern: horizontalPush
        targets: [mu.chest.clavicular, mu.front-delts]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.pulldown
        pattern: verticalPull
        targets: [mu.lats]
        priority: primary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.leg-extension
        pattern: kneeExtension
        targets: [mu.quads]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.lateral-raise
        pattern: shoulderAbduction
        targets: [mu.side-delts]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.triceps
        pattern: elbowExtension
        targets: [mu.triceps]
        priority: secondary
        goal: hypertrophy
        mode: doubleProgression
      - key: b.curl
        pattern: elbowFlexion
        targets: [mu.elbow-flexors]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
      - key: b.calf
        pattern: calf
        targets: [mu.calves]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
      - key: b.abs
        pattern: core
        targets: [mu.abs]
        priority: optional
        goal: hypertrophy
        mode: doubleProgression
