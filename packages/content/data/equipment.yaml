# Equipment catalog (EQP-01), in the EQP-01 order: bars, racks and benches, free weights, cables
# and machines, bodyweight stations and accessories, cardio.
#
# - loading: which load details the equipment editor asks for (EQP-03). Bars carry a default
#   weight per unit system (kg and lb gyms differ); stacks a default increment. Plate, dumbbell
#   and kettlebell inventories belong to the equipment profile; presets.yaml gives defaults.
# - variesByModel: the default is a typical value only; the editor asks the user to check it.
#   EQP-03 fixes the Olympic (20 kg / 45 lb) and women's (15 kg / 35 lb) bars; the other bar
#   weights are common manufacturer values.
# - Icons: the app maps `category` to an icon (EQP-01), so items carry no icon of their own.

# Bars
- id: eq.barbell-olympic
  name: { en: Olympic barbell }
  synonyms: [barbell, men's bar, power bar, 20 kg bar, 45 lb bar]
  category: bar
  loading:
    kind: bar
    defaultWeight: [{ value: 20, unit: kg }, { value: 45, unit: lb }]
    variesByModel: false

- id: eq.barbell-womens
  name: { en: Women's barbell }
  synonyms: [women's bar, 15 kg bar, 35 lb bar]
  category: bar
  loading:
    kind: bar
