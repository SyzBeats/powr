# Muscle taxonomy (PRD §7.2): the display groups of the body map, in PRD order, with the
# sub-regions the evidence base distinguishes (EB §Session › Mapping, "Implementation").
#
# - IDs: mu.<group> and mu.<group>.<sub-region>. A sub-region rolls up to its group by ID
#   convention (drop the last segment); exercise credits and the engine rely on it (EXL-05).
# - bodyMap: one region per view where the muscle is visible (MAP-01). The original artwork
#   (§8.11, OQ-08) carries these region IDs; sub-region paths nest inside the group's region.
# - area: grouping for the list view, filters and the heat-map legend (MAP-06).
# - ebHypertrophyData: the EB mapping table cites longitudinal hypertrophy data (H) for an exercise
#   that trains this muscle. false means the EB's credits for it are EMG or convention only.
# - optional: PRD §7.2 marks the group "optional, Could" (tibialis).

- id: mu.chest
  name: { en: Chest }
  synonyms: [pecs, pectorals, pectoralis major]
  area: chest
  bodyMap: { front: front.chest }
  ebHypertrophyData: true # bench press time course (PubMed 24265879)
  optional: false
  subRegions:
    - id: mu.chest.clavicular
      name: { en: Upper chest }
      synonyms: [clavicular head, upper pecs]
      bodyMap: { front: front.chest.clavicular }
      ebHypertrophyData: false # EMG plus one unverified training study (PubMed 36334406)
    - id: mu.chest.sternocostal
      name: { en: Mid and lower chest }
      synonyms: [sternocostal head, lower pecs]
      bodyMap: { front: front.chest.sternocostal }
      ebHypertrophyData: true

