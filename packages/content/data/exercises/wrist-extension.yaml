# Wrist extension. The EB has no row for direct forearm work: convention (C).

- id: ex.dumbbell-reverse-wrist-curl
  name: { en: Dumbbell reverse wrist curl }
  synonyms: [reverse wrist curl, wrist extension]
  pattern: wristExtension
  mechanics: isolation
  substitutionGroups: [sg.reverse-wrist-curl]
  equipment: { allOf: [eq.dumbbells], anyOf: [] }
  muscles:
    - { muscle: mu.forearms.extensors, credit: 1, evidence: C, source: src.powr-eb-mapping }
  load: { type: dumbbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 25], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 2, subRegions: [mu.forearms.extensors], standard: true }
  cues:
    - en: Sit with your forearms on your thighs, palms down and wrists past your knees.
    - en: Lift the back of your hands as high as you can, keeping your forearms still.
    - en: Lower slowly until your wrists are fully bent; light weights are enough.

# M5 additions (content 0.3.0): barbell and band reverse wrist curls, convention (C) as above.

- id: ex.barbell-reverse-wrist-curl
  name: { en: Barbell reverse wrist curl }
  synonyms: [barbell wrist extension]
  pattern: wristExtension
  mechanics: isolation
  substitutionGroups: [sg.reverse-wrist-curl]
  equipment:
    allOf: [eq.plates]
    anyOf:
      - [eq.barbell-olympic, eq.barbell-womens, eq.ez-bar]
      - [eq.flat-bench, eq.adjustable-bench]
  muscles:
    - { muscle: mu.forearms.extensors, credit: 1, evidence: C, source: src.powr-eb-mapping }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 25], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 2, subRegions: [mu.forearms.extensors], standard: true }
  cues:
    - en: Kneel beside a bench with your forearms on it, palms down and wrists just past the edge.
    - en: Raise the backs of your hands toward you as far as you can.
    - en: Lower slowly until your wrists are fully bent, using a light load.

- id: ex.band-reverse-wrist-curl
  name: { en: Band reverse wrist curl }
  synonyms: [band wrist extension]
  pattern: wristExtension
  mechanics: isolation
  substitutionGroups: [sg.reverse-wrist-curl]
  equipment: { allOf: [eq.resistance-bands], anyOf: [] }
  muscles:
    - { muscle: mu.forearms.extensors, credit: 1, evidence: C, source: src.powr-eb-mapping }
  load: { type: band, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [15, 30], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 0, subRegions: [mu.forearms.extensors] }
  cues:
    - en: Sit with your forearms on your thighs, palms down, and the band anchored under your feet.
    - en: Lift the backs of your hands up against the band.
    - en: Lower slowly into a full stretch.
