    stretchEmphasis: false
  ranking: { overloadSuitability: 1 }
  cues:
    - en: Hang from the bar with straight arms and stop any swing before you start.
    - en: Raise your knees or straight legs and curl your pelvis up toward your chest.
    - en: Lower slowly; start with bent knees and straighten them as you get stronger.

