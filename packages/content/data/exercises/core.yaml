# Core. The EB has no rows for direct ab work: convention (C). Trunk-flexion exercises credit the
# obliques 0.5 as synergists, as the EB's general scheme counts synergist sets as half.

- id: ex.cable-crunch
  name: { en: Cable crunch }
  synonyms: [kneeling cable crunch, rope crunch]
  pattern: core
  mechanics: isolation
  substitutionGroups: [sg.ab-flexion]
  equipment:
    allOf: []
    anyOf: [[eq.cable-station, eq.dual-cable-station, eq.lat-pulldown]]
  muscles:
    - { muscle: mu.abs, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.obliques, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 3 }
  cues:
    - en: Kneel facing a high pulley and hold the rope beside your head.
    - en: Curl your ribcage toward your pelvis by rounding your spine, not by bending at the hips.
    - en: Let your torso lengthen fully at the top before the next rep.

