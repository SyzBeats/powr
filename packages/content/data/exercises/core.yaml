  synonyms: [side bend, oblique side bend]
  pattern: core
  mechanics: isolation
  substitutionGroups: [sg.lateral-flexion]
  equipment: { allOf: [eq.dumbbells], anyOf: [] }
  muscles:
    - { muscle: mu.obliques, credit: 1, evidence: C, source: src.powr-eb-mapping }
  load: { type: dumbbell, curveClass: pooled, unilateral: true, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 2 }
  cues:
    - en: Stand tall with one dumbbell at your side and the other hand on your hip.
    - en: Lean toward the dumbbell side until you feel a stretch along the opposite side.
    - en: Pull yourself back upright with your obliques, then switch sides after the set.

# M5 additions (content 0.3.0), all convention (C):
# - Rollouts, sit-ups, leg raises and band crunches: trunk flexion or anti-extension, abs 1.0 and
#   obliques 0.5 as above.
# - Woodchops and Pallof presses resist or produce trunk rotation: obliques 1.0, abs 0.5. The
#   cable side bend is lateral flexion: obliques 1.0.
# - The floor back extension is spinal extension: spinal erectors 1.0, glute max 0.5. It sits in
#   the core pattern, the trunk's catch-all, because the contract has no spinal-extension pattern.

- id: ex.barbell-rollout
  name: { en: Barbell rollout }
  synonyms: [ab rollout, ab wheel rollout]
  pattern: core
  mechanics: isolation
  substitutionGroups: [sg.ab-flexion]
  equipment:
    allOf: [eq.plates]
    anyOf: [[eq.barbell-olympic, eq.barbell-womens]]
  muscles:
    - { muscle: mu.abs, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.obliques, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
  load: { type: bodyweightAdded, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [6, 15], strength: [6, 12] }
    restClass: hypertrophyIsolation
    tempo: 3-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 1 }
  cues:
    - en: Kneel behind a barbell loaded with round plates and hold it at shoulder-width.
    - en: Roll it forward slowly with your ribs pulled toward your hips, only as far as your lower back stays flat.
    - en: Pull the bar back to your knees by curling your trunk, not by bending at the hips.

