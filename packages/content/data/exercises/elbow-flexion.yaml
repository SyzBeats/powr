    - { muscle: mu.forearms.flexors, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: dumbbell, curveClass: pooled, unilateral: true, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 2 }
  cues:
    - en: Rest the back of your upper arm on a preacher pad or over the back of an upright incline bench.
    - en: Lower the dumbbell until your elbow is almost straight.
    - en: Curl it up without letting your shoulder roll forward or your elbow lift.

