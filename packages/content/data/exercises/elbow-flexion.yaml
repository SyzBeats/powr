- id: ex.band-curl
  name: { en: Band curl }
  synonyms: [resistance band curl]
  pattern: elbowFlexion
  mechanics: isolation
  substitutionGroups: [sg.curl]
  equipment: { allOf: [eq.resistance-bands], anyOf: [] }
  muscles:
    - { muscle: mu.elbow-flexors, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.forearms.flexors, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: band, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [12, 30], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 0 }
  cues:
    - en: Stand on the band and hold the ends with palms facing forward.
    - en: Curl up to full elbow bend while your elbows stay at your sides.
    - en: Use a stronger band or stand on it wider when 30 reps become easy.

# M5 additions (content 0.3.0): preacher, cable and concentration curls are loaded supinated curls
# and keep the "Biceps curl" row's H tag (Mannarino 2021). The behind-the-body cable curl is a cable
# curl with the shoulder extended, which loads the biceps at a long length. Reverse and hammer
# variations, the band hammer curl and the bodyweight ring curl are extrapolations (C); pronated
# and neutral grips shift work to the brachialis and the brachioradialis (credited to the forearm
# extensors and the forearms, 0.5).

- id: ex.ez-bar-preacher-curl
  name: { en: EZ-bar preacher curl }
  synonyms: [preacher curl, scott curl]
  pattern: elbowFlexion
  mechanics: isolation
  substitutionGroups: [sg.curl]
  equipment:
    allOf: [eq.plates, eq.preacher-bench]
    anyOf: [[eq.ez-bar, eq.barbell-olympic, eq.barbell-womens]]
  muscles:
    - { muscle: mu.elbow-flexors, credit: 1, evidence: H, source: src.mannarino2021 }
    - { muscle: mu.forearms.flexors, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 3, standard: true }
  cues:
    - en: Sit at the preacher bench with your armpits snug against the top of the pad.
    - en: Lower the bar until your elbows are almost straight, slowing down near the bottom.
    - en: Curl up until your forearms are vertical without lifting your elbows off the pad.

