# Curls. Credits: "Biceps curl" row: elbow flexors 1.0 (H: curls grew the elbow flexors +11.06% vs
# +5.16% for rows, Mannarino 2021), forearm flexors 0.25 (C). Curls with external load (barbell,
# dumbbells, incline) keep the H tag. The hammer curl (neutral grip) and the band curl (a different
# resistance profile) are extrapolations and tagged C.

- id: ex.barbell-curl
  name: { en: Barbell curl }
  synonyms: [standing barbell curl, ez-bar curl, straight-bar curl]
  pattern: elbowFlexion
  mechanics: isolation
  substitutionGroups: [sg.curl]
  equipment:
    allOf: [eq.plates]
    anyOf: [[eq.barbell-olympic, eq.barbell-womens, eq.ez-bar]]
  muscles:
    - { muscle: mu.elbow-flexors, credit: 1, evidence: H, source: src.mannarino2021 }
    - { muscle: mu.forearms.flexors, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 3, subRegions: [mu.elbow-flexors.biceps], standard: true }
  cues:
    - en: Hold the bar with an underhand grip at about shoulder-width, elbows at your sides.
    - en: Curl the bar up without swinging your torso or moving your elbows forward much.
    - en: Lower until your arms are fully straight before the next rep.

- id: ex.dumbbell-curl
  name: { en: Dumbbell curl }
  synonyms: [standing dumbbell curl, alternating dumbbell curl, db curl]
  pattern: elbowFlexion
  mechanics: isolation
  substitutionGroups: [sg.curl]
  equipment: { allOf: [eq.dumbbells], anyOf: [] }
