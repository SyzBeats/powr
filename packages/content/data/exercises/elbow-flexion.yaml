    stretchEmphasis: false
  ranking: { overloadSuitability: 1 }
  cues:
    - en: Hold the rings with your palms up and lean back on straight arms, body in one line.
    - en: Curl your hands toward your forehead, pulling your body up while your elbows point forward.
    - en: Lower back to straight arms; walk your feet forward to make it harder.
