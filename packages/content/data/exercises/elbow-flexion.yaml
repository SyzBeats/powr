- id: ex.behind-the-body-cable-curl
  name: { en: Behind-the-body cable curl }
  synonyms: [bayesian curl, bayesian cable curl]
  pattern: elbowFlexion
  mechanics: isolation
  substitutionGroups: [sg.curl]
  equipment:
    allOf: []
    anyOf: [[eq.cable-station, eq.dual-cable-station]]
  muscles:
    - { muscle: mu.elbow-flexors, credit: 1, evidence: H, source: src.mannarino2021 }
    - { muscle: mu.forearms.flexors, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: pooled, unilateral: true, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 2, subRegions: [mu.elbow-flexors.biceps] }
  cues:
