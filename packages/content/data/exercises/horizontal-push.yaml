# M5 additions (content 0.3.0):
# - Spoto, pin and Larsen presses are close variants of the competition bench: flat barbell
#   presses through (nearly) the full range, so they keep the flat-bench credits and H tags
#   (PubMed 24265879).
# - Incline barbell and Smith-machine incline presses follow the "Incline press (30–45°)" row like
#   the incline dumbbell press (clavicular EMG, PubMed 34644424; the rest C).
# - Decline press, Smith-machine bench, floor press, cable press and the push-up variations reuse
#   the flat-bench or push-up row as convention (C). The decline press credits the anterior delt
#   0.25 (less shoulder flexion than the flat bench). The diamond push-up takes the close-grip
#   bench row with the pec at 0.5: the hands sit closer still, so the triceps do most of the work.

- id: ex.spoto-press
  name: { en: Spoto press }
  synonyms: [spoto bench press]
  pattern: horizontalPush
  mechanics: compound
  variantOf: ex.barbell-bench-press
  substitutionGroups: [sg.chest-press]
  equipment:
    allOf: [eq.plates]
    anyOf:
      - [eq.barbell-olympic, eq.barbell-womens]
      - [eq.flat-bench, eq.adjustable-bench]
      - [eq.power-rack, eq.squat-stand]
  muscles:
    - { muscle: mu.chest.sternocostal, credit: 1, evidence: H, source: src.pmid24265879 }
    - { muscle: mu.triceps, credit: 0.5, evidence: H, source: src.pmid24265879 }
    - { muscle: mu.front-delts, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
  load: { type: barbell, curveClass: equation, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [6, 12], strength: [2, 6] }
    restClass: strength
    tempo: 2-1-X-0
    fixedRom: true
    stretchEmphasis: false
  ranking: { overloadSuitability: 3, subRegions: [mu.chest.sternocostal] }
  cues:
    - en: Set up exactly as for your competition bench press.
    - en: Lower the bar under control and stop it a finger-width or two above your chest.
    - en: Hold it there for a moment without touching, then press to lockout.

