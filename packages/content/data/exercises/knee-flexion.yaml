# Knee flexion. Credits:
# - "Seated leg curl": hamstrings 1.0 with biarticular emphasis (H, Maeo 2021: +14% vs +9% for
#   lying); gastrocnemius 0.25 optional (C).
# - "Lying leg curl": hamstrings 1.0 (H, Maeo 2021), gastrocnemius 0.25 optional (C).
# - "Nordic curl": hamstrings (semitendinosus) 1.0 (H, Bourne 2017).
# Knee flexion also trains the biceps femoris short head, which hip-extension exercises miss; the
# curls list it in ranking.subRegions for that reason (MAP-03 (e)).

- id: ex.seated-leg-curl
  name: { en: Seated leg curl }
  synonyms: [seated hamstring curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  equipment: { allOf: [eq.seated-leg-curl], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: H, source: src.maeo2021 }
    - { muscle: mu.calves.gastrocnemius, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: legPressLike, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: true
  ranking:
    overloadSuitability: 3
    subRegions: [mu.hamstrings.biarticular, mu.hamstrings.short-head]
  cues:
    - en: Line up your knees with the machine's pivot and lock the thigh pad down firmly.
    - en: Sit tall or lean slightly forward so your hamstrings start in a stretch.
    - en: Curl your heels under the seat as far as you can, then return slowly to straight legs.

- id: ex.lying-leg-curl
  name: { en: Lying leg curl }
  synonyms: [prone leg curl, lying hamstring curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  equipment: { allOf: [eq.lying-leg-curl], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: H, source: src.maeo2021 }
    - { muscle: mu.calves.gastrocnemius, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: legPressLike, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 3, subRegions: [mu.hamstrings.short-head] }
  cues:
    - en: Lie face down with your knees just off the pad and the roller above your heels.
    - en: Keep your hips pressed into the bench as you curl.
    - en: Lower all the way to straight legs on every rep.

- id: ex.nordic-curl
  name: { en: Nordic curl }
  synonyms: [nordic hamstring curl, nordic ham curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  # Needs only an anchor for the heels: a partner, a loaded bar or a sturdy piece of furniture.
  equipment: { allOf: [], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: H, source: src.bourne2017 }
  load: { type: bodyweightAdded, curveClass: pooled, unilateral: false, bodyweightLoaded: true }
  defaults:
    repRange: { hypertrophy: [5, 10], strength: [5, 10] }
    restClass: hypertrophyIsolation
    tempo: 4-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 1, subRegions: [mu.hamstrings.biarticular] }
  cues:
    - en: Kneel on a pad with your heels anchored under something solid.
    - en: Keep hips and torso in one line and lower yourself forward as slowly as you can.
    - en: Catch yourself with your hands and push back up just enough to restart.
