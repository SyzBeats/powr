# Knee flexion. Credits:
# - "Seated leg curl": hamstrings 1.0 with biarticular emphasis (H, Maeo 2021: +14% vs +9% for
#   lying); gastrocnemius 0.25 optional (C).
# - "Lying leg curl": hamstrings 1.0 (H, Maeo 2021), gastrocnemius 0.25 optional (C).
# - "Nordic curl": hamstrings (semitendinosus) 1.0 (H, Bourne 2017).
# Knee flexion also trains the biceps femoris short head, which hip-extension exercises miss; the
# curls list it in ranking.subRegions for that reason (MAP-03 (e)).

- id: ex.seated-leg-curl
  name: { en: Seated leg curl }
  synonyms: [seated hamstring curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  equipment: { allOf: [eq.seated-leg-curl], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: H, source: src.maeo2021 }
    - { muscle: mu.calves.gastrocnemius, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: legPressLike, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: true
  ranking:
    overloadSuitability: 3
    subRegions: [mu.hamstrings.biarticular, mu.hamstrings.short-head]
  cues:
    - en: Line up your knees with the machine's pivot and lock the thigh pad down firmly.
    - en: Sit tall or lean slightly forward so your hamstrings start in a stretch.
    - en: Curl your heels under the seat as far as you can, then return slowly to straight legs.

- id: ex.lying-leg-curl
  name: { en: Lying leg curl }
  synonyms: [prone leg curl, lying hamstring curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  equipment: { allOf: [eq.lying-leg-curl], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: H, source: src.maeo2021 }
    - { muscle: mu.calves.gastrocnemius, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: legPressLike, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 3, subRegions: [mu.hamstrings.short-head] }
  cues:
    - en: Lie face down with your knees just off the pad and the roller above your heels.
    - en: Keep your hips pressed into the bench as you curl.
    - en: Lower all the way to straight legs on every rep.

- id: ex.nordic-curl
  name: { en: Nordic curl }
  synonyms: [nordic hamstring curl, nordic ham curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  # Needs only an anchor for the heels: a partner, a loaded bar or a sturdy piece of furniture.
  equipment: { allOf: [], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: H, source: src.bourne2017 }
  load: { type: bodyweightAdded, curveClass: pooled, unilateral: false, bodyweightLoaded: true }
  defaults:
    repRange: { hypertrophy: [5, 10], strength: [5, 10] }
    restClass: hypertrophyIsolation
    tempo: 4-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 1, subRegions: [mu.hamstrings.biarticular] }
  cues:
    - en: Kneel on a pad with your heels anchored under something solid.
    - en: Keep hips and torso in one line and lower yourself forward as slowly as you can.
    - en: Catch yourself with your hands and push back up just enough to restart.

# M5 additions (content 0.3.0): curls that the EB table does not name (glute-ham raise, dumbbell,
# cable, band and sliding curls) reuse the leg-curl rows as convention (C). The glute-ham raise
# also extends the hip, so it credits the glute max 0.25.

- id: ex.glute-ham-raise
  name: { en: Glute-ham raise }
  synonyms: [ghr, glute ham raise]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  equipment: { allOf: [eq.glute-ham-developer], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.glutes.max, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.calves.gastrocnemius, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: bodyweightAdded, curveClass: pooled, unilateral: false, bodyweightLoaded: true }
  defaults:
    repRange: { hypertrophy: [5, 12], strength: [5, 10] }
    restClass: hypertrophyIsolation
    tempo: 3-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 1, subRegions: [mu.hamstrings.biarticular] }
  cues:
    - en: Set the foot plate so your knees sit just behind the pad, and lock your heels in.
    - en: Start upright, then lower your torso forward under control by straightening your knees.
    - en: Pull yourself back up with your hamstrings while your hips stay extended.

- id: ex.dumbbell-leg-curl
  name: { en: Dumbbell leg curl }
  synonyms: [dumbbell lying leg curl, db leg curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  equipment:
    allOf: [eq.dumbbells]
    anyOf: [[eq.flat-bench, eq.adjustable-bench]]
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.calves.gastrocnemius, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: dumbbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 1, subRegions: [mu.hamstrings.short-head] }
  cues:
    - en: Lie face down on a bench with your knees just past its end and a dumbbell held between your feet.
    - en: Curl your heels toward your glutes while your hips stay pressed into the bench.
    - en: Lower slowly to straight legs, and start light until the dumbbell feels secure between your feet.

- id: ex.standing-cable-leg-curl
  name: { en: Standing cable leg curl }
  synonyms: [cable leg curl, single-leg cable curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  equipment:
    allOf: []
    anyOf: [[eq.cable-station, eq.dual-cable-station]]
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.calves.gastrocnemius, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: pooled, unilateral: true, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 2, subRegions: [mu.hamstrings.short-head] }
  cues:
    - en: Put an ankle strap on a low pulley and stand facing the machine, holding on for balance.
    - en: Curl your heel toward your glutes without letting your thigh swing forward.
    - en: Lower until the leg is straight, and finish all reps before you switch legs.

- id: ex.band-leg-curl
  name: { en: Band leg curl }
  synonyms: [resistance band leg curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  equipment: { allOf: [eq.resistance-bands], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: C, source: src.powr-eb-mapping }
  load: { type: band, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [12, 30], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 0 }
  cues:
    - en: Lie face down with a band anchored low in front of you and looped around your heels.
    - en: Curl your heels toward your glutes against the band.
    - en: Straighten your legs slowly while your hips stay on the floor.

- id: ex.sliding-leg-curl
  name: { en: Sliding leg curl }
  synonyms: [slider leg curl, towel leg curl]
  pattern: kneeFlexion
  mechanics: isolation
  substitutionGroups: [sg.leg-curl]
  # Sliders or a towel on a smooth floor: no catalog item needed.
  equipment: { allOf: [], anyOf: [] }
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.glutes.max, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: bodyweightAdded, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 3-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 1 }
  cues:
    - en: Lie on your back with your heels on sliders or a towel on a smooth floor.
    - en: Lift your hips into a bridge and slide your heels out until your legs are almost straight.
    - en: Pull your heels back toward your glutes while your hips stay up.
