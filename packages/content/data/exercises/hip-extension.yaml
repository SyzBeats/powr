- id: ex.single-leg-hip-thrust
  name: { en: Single-leg hip thrust }
  synonyms: [one-leg hip thrust]
  pattern: hipExtension
  mechanics: compound
  substitutionGroups: [sg.hip-thrust]
  # Upper back on a bench or a couch: no catalog item needed.
  equipment: { allOf: [], anyOf: [] }
  muscles:
    - { muscle: mu.glutes.max, credit: 1, evidence: H, source: src.plotkin2023 }
    - { muscle: mu.quads, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.hamstrings, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: bodyweightAdded, curveClass: pooled, unilateral: true, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 20], strength: [8, 12] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 1, subRegions: [mu.glutes.max] }
  cues:
    - en: Rest your upper back on a bench or couch with one foot planted and the other leg lifted.
    - en: Drive through the planted heel until your hips are level, without twisting.
    - en: Lower slowly and finish all reps before you switch legs.

