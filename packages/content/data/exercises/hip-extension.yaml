  name: { en: Reverse hyperextension }
  synonyms: [reverse hyper, reverse back extension]
  pattern: hipExtension
  mechanics: compound
  substitutionGroups: [sg.back-extension]
  equipment: { allOf: [eq.reverse-hyper], anyOf: [] }
  muscles:
    - { muscle: mu.glutes.max, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.hamstrings, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.lower-back, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [8, 12] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 2 }
  cues:
    - en: Lie face down on the pad with your hips at its edge and hold the handles.
    - en: Swing your legs up behind you until they line up with your torso, squeezing your glutes.
    - en: Lower your legs under control instead of letting the pendulum swing them.

- id: ex.cable-glute-kickback
  name: { en: Cable glute kickback }
  synonyms: [glute kickback, cable hip extension]
  pattern: hipExtension
  mechanics: isolation
  substitutionGroups: [sg.hip-thrust]
  equipment:
    allOf: []
    anyOf: [[eq.cable-station, eq.dual-cable-station]]
  muscles:
    - { muscle: mu.glutes.max, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.hamstrings, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: pooled, unilateral: true, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 2, subRegions: [mu.glutes.max] }
  cues:
    - en: Put an ankle strap on a low pulley and face the machine, holding on with both hands.
    - en: Lean forward slightly and push the working leg back until your hip is fully extended.
    - en: Return slowly until the knee comes in front of the hip, keeping your lower back still.
