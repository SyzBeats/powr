- id: ex.dip
  name: { en: Dip }
  synonyms: [chest dip, parallel bar dip, bar dip]
  pattern: verticalPush
  mechanics: compound
  substitutionGroups: [sg.dip, sg.triceps-press]
  equipment: { allOf: [eq.dip-station], anyOf: [] }
  muscles:
    - { muscle: mu.chest.sternocostal, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.triceps, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.front-delts, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
  load: { type: bodyweightAdded, curveClass: pooled, unilateral: false, bodyweightLoaded: true }
  defaults:
    repRange: { hypertrophy: [6, 15], strength: [6, 12] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 2, subRegions: [mu.chest.sternocostal] }
  cues:
    - en: Support yourself on straight arms and lean your torso slightly forward.
    - en: Lower until your shoulders are just below your elbows, or as deep as your shoulders allow.
    - en: Press back to straight arms; add weight with a dip belt when 15 reps are easy.

# M5 additions (content 0.3.0): the machine, push, Arnold, landmine and band presses and the
# handstand push-up reuse the "Overhead press" row as convention (the landmine press moves in an
# arc between incline and overhead pressing, so it credits the clavicular pec 0.5 instead of the
# lateral delt and upper traps). Ring and band-assisted dips reuse the "Dips (torso forward)" row.
# The handstand push-up rates overload suitability 0: it cannot be made lighter, so the pike
# push-up stays the bodyweight press the generator picks first.

- id: ex.machine-shoulder-press
  name: { en: Machine shoulder press }
  synonyms: [machine overhead press, seated machine shoulder press]
  pattern: verticalPush
  mechanics: compound
  substitutionGroups: [sg.overhead-press]
  equipment: { allOf: [eq.shoulder-press-machine], anyOf: [] }
  muscles:
    - { muscle: mu.front-delts, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.side-delts, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.triceps, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.upper-traps, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: equation, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [6, 12] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 3 }
  cues:
    - en: Set the seat so the handles start at about shoulder height.
    - en: Press up until your arms are straight without shrugging your shoulders toward your ears.
    - en: Lower the handles back to shoulder height under control.

- id: ex.push-press
  name: { en: Push press }
  synonyms: [barbell push press]
  pattern: verticalPush
  mechanics: compound
  substitutionGroups: [sg.overhead-press]
  equipment:
    allOf: [eq.plates]
    anyOf: [[eq.barbell-olympic, eq.barbell-womens], [eq.power-rack, eq.squat-stand]]
  muscles:
    - { muscle: mu.front-delts, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.side-delts, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.triceps, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.upper-traps, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: barbell, curveClass: equation, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [6, 10], strength: [3, 6] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 3 }
  cues:
    - en: Hold the bar on your front delts with a grip just outside your shoulders.
    - en: Dip a few centimetres at the knees with your torso upright, then drive up hard through your legs.
    - en: Let the leg drive start the bar and finish the press overhead with your arms.
    - en: Lower the bar back to your shoulders under control, absorbing it with your knees.

