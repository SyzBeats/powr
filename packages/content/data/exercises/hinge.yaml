    - { muscle: mu.lower-back, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.quads, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.hamstrings, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.adductors, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.upper-traps, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.forearms.flexors, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: barbell, curveClass: equation, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [6, 10], strength: [1, 5] }
    restClass: strength
    tempo: 2-0-X-0
    fixedRom: true
    stretchEmphasis: false
  ranking: { overloadSuitability: 3 }
  cues:
    - en: Start the pull exactly as in your competition deadlift.
    - en: Stop when the bar is a few centimetres off the floor and hold it there for one to two seconds.
    - en: Keep your back flat and the bar against your shins during the pause.
    - en: Finish the pull from the pause in the same positions you held.

