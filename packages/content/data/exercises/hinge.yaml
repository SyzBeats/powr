- id: ex.barbell-good-morning
  name: { en: Barbell good morning }
  synonyms: [good morning]
  pattern: hinge
  mechanics: compound
  substitutionGroups: [sg.romanian-deadlift]
  equipment:
    allOf: [eq.plates]
    anyOf: [[eq.barbell-olympic, eq.barbell-womens], [eq.power-rack, eq.squat-stand]]
  muscles:
    - { muscle: mu.hamstrings, credit: 1, evidence: H, source: src.bourne2017 }
    - { muscle: mu.glutes.max, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.adductors, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.lower-back, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.quads, credit: 0, evidence: C, source: src.powr-eb-mapping }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [6, 12] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 2, subRegions: [mu.hamstrings.biarticular] }
  cues:
    - en: Rest the bar on your upper back as for a squat and unlock your knees slightly.
    - en: Push your hips back and let your torso tip forward with your back flat.
    - en: Go down until your hamstrings are fully stretched, usually with your torso a little above horizontal.
    - en: Drive your hips forward to stand up, and start light, because this loads your lower back hard.

- id: ex.kettlebell-swing
  name: { en: Kettlebell swing }
  synonyms: [two-hand kettlebell swing, kb swing]
  pattern: hinge
  mechanics: compound
  substitutionGroups: [sg.pull-through]
  equipment:
    allOf: []
    anyOf: [[eq.kettlebells, eq.dumbbells]]
  muscles:
    - { muscle: mu.glutes.max, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.hamstrings, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.lower-back, credit: 0.25, evidence: C, source: src.powr-eb-mapping }
  load: { type: dumbbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [6, 12] }
    restClass: hypertrophyCompound
    tempo: 1-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 1, subRegions: [mu.glutes.max] }
  cues:
    - en: Stand with the bell a step in front of you, hinge and grip it with both hands.
    - en: Hike it back between your legs, then snap your hips forward so it floats to chest height.
    - en: Let your arms only guide the bell; the power comes from your hips, not from a squat or a lift.
    - en: Hinge again as the bell comes down and keep your back flat throughout.

