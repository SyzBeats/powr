# Triceps extensions. Credits (H, Maeo 2023: overhead extensions grew the triceps 1.4–1.5× more
# than the neutral arm position):
# - "Overhead triceps extension": triceps 1.0, long-head emphasis.
# - "Pressdown / skull crusher": triceps 1.0, lateral/medial emphasis.

- id: ex.cable-triceps-pressdown
  name: { en: Cable triceps pressdown }
  synonyms: [triceps pushdown, rope pushdown, pressdown]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.triceps-pressdown]
  equipment:
    allOf: []
    anyOf: [[eq.cable-station, eq.dual-cable-station, eq.lat-pulldown]]
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: H, source: src.maeo2023 }
  load: { type: machine, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 3, subRegions: [mu.triceps.lateral-medial], standard: true }
  cues:
    - en: Set the pulley high and hold a rope or bar with your elbows pinned to your sides.
    - en: Push down until your arms are straight, spreading the rope ends at the bottom.
    - en: Let your forearms rise until they pass horizontal before the next rep.

- id: ex.overhead-cable-triceps-extension
  name: { en: Overhead cable triceps extension }
  synonyms: [cable overhead extension, overhead rope extension]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.overhead-triceps-extension]
  equipment:
    allOf: []
    anyOf: [[eq.cable-station, eq.dual-cable-station]]
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: H, source: src.maeo2023 }
  load: { type: machine, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 3, subRegions: [mu.triceps.long-head], standard: true }
  cues:
    - en: Face away from a low or mid pulley with the rope behind your head and elbows pointing up.
    - en: Let your hands sink behind your head until your triceps are fully stretched.
    - en: Extend your elbows until your arms are straight, keeping your upper arms still.

- id: ex.dumbbell-overhead-triceps-extension
  name: { en: Dumbbell overhead triceps extension }
  synonyms: [overhead dumbbell extension, french press, seated dumbbell extension]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.overhead-triceps-extension]
  equipment: { allOf: [eq.dumbbells], anyOf: [] }
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: H, source: src.maeo2023 }
  load: { type: dumbbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 2, subRegions: [mu.triceps.long-head], standard: true }
  cues:
    - en: Hold one dumbbell with both hands under the top plate, arms straight overhead.
    - en: Lower it behind your head until your elbows are fully bent, elbows pointing forward.
    - en: Press back to straight arms; sit with back support if your lower back arches.

- id: ex.ez-bar-skull-crusher
  name: { en: EZ-bar skull crusher }
  synonyms: [skull crusher, lying triceps extension]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.triceps-pressdown]
  equipment:
    allOf: [eq.plates]
    anyOf:
      - [eq.ez-bar, eq.barbell-olympic, eq.barbell-womens]
      - [eq.flat-bench, eq.adjustable-bench]
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: H, source: src.maeo2023 }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 3, subRegions: [mu.triceps.lateral-medial], standard: true }
  cues:
    - en: Lie on a bench and hold the bar over your shoulders with a narrow grip.
    - en: Bend only at the elbows to lower the bar toward your forehead or just behind it.
    - en: Extend your arms fully without letting your elbows flare out.

# M5 additions (content 0.3.0): the dumbbell skull crusher and the EZ-bar overhead extension are
# the EB's "Pressdown / skull crusher" and "Overhead triceps extension" rows (H, Maeo 2023).
# Kickbacks, band and bodyweight extensions are extrapolations (C); the arm position decides the
# ranked head: overhead → long head, arm at the side or behind the body → lateral/medial heads.

- id: ex.dumbbell-skull-crusher
  name: { en: Dumbbell skull crusher }
  synonyms: [dumbbell lying triceps extension, db skull crusher]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.triceps-pressdown]
  equipment:
    allOf: [eq.dumbbells]
    anyOf: [[eq.flat-bench, eq.adjustable-bench]]
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: H, source: src.maeo2023 }
  load: { type: dumbbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 2, subRegions: [mu.triceps.lateral-medial] }
  cues:
    - en: Lie on a bench with a dumbbell in each hand above your shoulders, palms facing each other.
    - en: Bend only at the elbows to lower the dumbbells beside your head.
    - en: Straighten your arms fully without letting your elbows drift out.

- id: ex.ez-bar-overhead-triceps-extension
  name: { en: EZ-bar overhead triceps extension }
  synonyms: [ez-bar overhead extension, seated barbell triceps extension]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.overhead-triceps-extension]
  equipment:
    allOf: [eq.plates]
    anyOf: [[eq.ez-bar, eq.barbell-olympic, eq.barbell-womens]]
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: H, source: src.maeo2023 }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 3, subRegions: [mu.triceps.long-head] }
  cues:
    - en: Sit upright with back support and hold the bar overhead with a narrow grip.
    - en: Lower it behind your head by bending your elbows while they keep pointing forward.
    - en: Extend back to straight arms without arching your lower back.

- id: ex.dumbbell-kickback
  name: { en: Dumbbell kickback }
  synonyms: [triceps kickback, db kickback]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.triceps-pressdown]
  equipment: { allOf: [eq.dumbbells], anyOf: [] }
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: C, source: src.powr-eb-mapping }
  load: { type: dumbbell, curveClass: pooled, unilateral: true, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 1, subRegions: [mu.triceps.lateral-medial], standard: true }
  cues:
    - en: Hinge forward with a flat back and hold your upper arm alongside your torso.
    - en: Straighten your elbow until your arm is in line with your body.
    - en: Lower the dumbbell under control without letting your upper arm drop.

- id: ex.cable-triceps-kickback
  name: { en: Cable triceps kickback }
  synonyms: [triceps cable kickback]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.triceps-pressdown]
  equipment:
    allOf: []
    anyOf: [[eq.cable-station, eq.dual-cable-station]]
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: pooled, unilateral: true, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [10, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-1
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 2, subRegions: [mu.triceps.lateral-medial] }
  cues:
    - en: Hold a handle or the bare cable from a low pulley and hinge forward slightly.
    - en: Keep your upper arm against your side and extend the elbow until the arm is straight.
    - en: Let the forearm swing back to vertical under control.

