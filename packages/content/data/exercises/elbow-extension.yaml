- id: ex.bodyweight-triceps-extension
  name: { en: Bodyweight triceps extension }
  synonyms: [bodyweight skull crusher, bar triceps extension]
  pattern: elbowExtension
  mechanics: isolation
  substitutionGroups: [sg.overhead-triceps-extension]
  equipment:
    allOf: []
    anyOf: [[eq.rings, eq.power-rack, eq.smith-machine]]
  muscles:
    - { muscle: mu.triceps, credit: 1, evidence: C, source: src.powr-eb-mapping }
  load: { type: bodyweightAdded, curveClass: pooled, unilateral: false, bodyweightLoaded: true }
  defaults:
    repRange: { hypertrophy: [8, 20], strength: [8, 12] }
    restClass: hypertrophyIsolation
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 1, subRegions: [mu.triceps.long-head] }
  cues:
    - en: Hold a bar set at hip height or a pair of rings and lean in on straight arms, body in one line.
    - en: Bend your elbows to lower your forehead toward your hands while your elbows point forward.
    - en: Push back to straight arms; set the bar higher to make it easier.
