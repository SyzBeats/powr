# Squat pattern. Credits: EB mapping rows "Back squat (≥ parallel)" (H: Kubo 2019, Plotkin 2023;
# rectus femoris EMG: Ema 2016) and "Leg press / hack squat" (rectus femoris EMG; the rest C).
# Squat variants the table does not name (front, goblet) reuse the back-squat row as convention.
#
# Conventions for every exercise file:
# - Rep ranges: EB §Defaults › Volume. Hypertrophy 6–15 (compound) / 8–20 (isolation); strength
#   1–6 for competition lifts and close variants, 6–12 for accessories (8–12 for isolation).
# - Rest class: competition lifts and close variants `strength`; other compounds
#   `hypertrophyCompound`; isolation `hypertrophyIsolation` (TMR-02).
# - Tempo 2-0-X-0 (EB §Session › Tempo); paused variants put their pause in the second field.
# - stretchEmphasis follows EB §Session › ROM where it names the exercise; elsewhere it is the
#   authors' judgement of whether the target muscles are loaded at long lengths.
# - Cues are original text written for POWR (LicenseRef-Own-Work).

- id: ex.barbell-back-squat
  name: { en: Barbell back squat }
  synonyms: [back squat, high-bar squat, low-bar squat, squat]
  pattern: squat
  mechanics: compound
  competitionLift: squat
  substitutionGroups: [sg.squat]
  equipment:
    allOf: [eq.plates]
    anyOf: [[eq.barbell-olympic, eq.barbell-womens], [eq.power-rack, eq.squat-stand]]
  muscles:
    - { muscle: mu.quads.vasti, credit: 1, evidence: H, source: src.kubo2019 }
    - { muscle: mu.quads.rectus-femoris, credit: 0, evidence: EMG, source: src.ema2016 }
    # EB: "consider 1.0 if deep"; 0.5 is the default for squats to parallel.
    - { muscle: mu.glutes.max, credit: 0.5, evidence: H, source: src.plotkin2023 }
    - { muscle: mu.adductors, credit: 0.5, evidence: H, source: src.kubo2019 }
    # "Squats don't count toward hamstrings" (MRI evidence).
    - { muscle: mu.hamstrings, credit: 0, evidence: H, source: src.kubo2019 }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [6, 12], strength: [1, 6] }
    restClass: strength
    tempo: 2-0-X-0
    fixedRom: true
    stretchEmphasis: true
  ranking: { overloadSuitability: 3, subRegions: [mu.quads.vasti] }
  cues:
    - en: Brace before you unrack and keep the bar over mid-foot.
    - en: Sit down between your hips until your hip crease is below the knee.
    - en: Let your knees travel forward over your toes as far as your depth needs.
    - en: Drive up with intent, chest and hips rising together.

- id: ex.paused-back-squat
  name: { en: Paused back squat }
  synonyms: [pause squat]
  pattern: squat
  mechanics: compound
  variantOf: ex.barbell-back-squat
  substitutionGroups: [sg.squat]
  equipment:
    allOf: [eq.plates]
    anyOf: [[eq.barbell-olympic, eq.barbell-womens], [eq.power-rack, eq.squat-stand]]
  muscles:
    - { muscle: mu.quads.vasti, credit: 1, evidence: H, source: src.kubo2019 }
    - { muscle: mu.quads.rectus-femoris, credit: 0, evidence: EMG, source: src.ema2016 }
    - { muscle: mu.glutes.max, credit: 0.5, evidence: H, source: src.plotkin2023 }
    - { muscle: mu.adductors, credit: 0.5, evidence: H, source: src.kubo2019 }
    - { muscle: mu.hamstrings, credit: 0, evidence: H, source: src.kubo2019 }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [6, 12], strength: [1, 6] }
    restClass: strength
    tempo: 2-2-X-0
    fixedRom: true
    stretchEmphasis: true
  ranking: { overloadSuitability: 3, subRegions: [mu.quads.vasti] }
  cues:
    - en: Squat to your usual competition depth, then hold still for two seconds.
    - en: Stay braced and tight in the hole; do not relax onto your knees or hips.
    - en: Drive out of the pause without a bounce, keeping the bar over mid-foot.

- id: ex.barbell-front-squat
  name: { en: Barbell front squat }
  synonyms: [front squat]
  pattern: squat
  mechanics: compound
  substitutionGroups: [sg.squat]
  equipment:
    allOf: [eq.plates]
    anyOf: [[eq.barbell-olympic, eq.barbell-womens], [eq.power-rack, eq.squat-stand]]
  muscles:
    - { muscle: mu.quads.vasti, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.quads.rectus-femoris, credit: 0, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.glutes.max, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.adductors, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.hamstrings, credit: 0, evidence: C, source: src.powr-eb-mapping }
  load: { type: barbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [6, 12], strength: [6, 12] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 3, subRegions: [mu.quads.vasti] }
  cues:
    - en: Rest the bar on your front delts with high elbows and a relaxed grip.
    - en: Keep your torso upright and sit straight down as deep as you can stay braced.
    - en: Lead the drive up with your elbows so the bar does not roll forward.

- id: ex.goblet-squat
  name: { en: Goblet squat }
  synonyms: [dumbbell goblet squat, kettlebell goblet squat]
  pattern: squat
  mechanics: compound
  substitutionGroups: [sg.squat]
  equipment:
    allOf: []
    anyOf: [[eq.dumbbells, eq.kettlebells]]
  muscles:
    - { muscle: mu.quads.vasti, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.quads.rectus-femoris, credit: 0, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.glutes.max, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.adductors, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.hamstrings, credit: 0, evidence: C, source: src.powr-eb-mapping }
  load: { type: dumbbell, curveClass: pooled, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [6, 12] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 2 }
  cues:
    - en: Hold one dumbbell or kettlebell vertically against your chest.
    - en: Sit down between your heels, elbows inside your knees at the bottom.
    - en: Go as deep as you can with a neutral back, then stand up tall.

- id: ex.leg-press
  name: { en: Leg press }
  synonyms: [45 degree leg press, sled leg press]
  pattern: squat
  mechanics: compound
  substitutionGroups: [sg.squat]
  equipment: { allOf: [eq.leg-press, eq.plates], anyOf: [] }
  muscles:
    - { muscle: mu.quads.vasti, credit: 1, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.quads.rectus-femoris, credit: 0, evidence: EMG, source: src.ema2016 }
    - { muscle: mu.glutes, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.adductors, credit: 0.5, evidence: C, source: src.powr-eb-mapping }
    - { muscle: mu.hamstrings, credit: 0, evidence: C, source: src.powr-eb-mapping }
  load: { type: machine, curveClass: legPressLike, unilateral: false, bodyweightLoaded: false }
  defaults:
    repRange: { hypertrophy: [8, 15], strength: [6, 12] }
    restClass: hypertrophyCompound
    tempo: 2-0-X-0
    fixedRom: false
    stretchEmphasis: false
  ranking: { overloadSuitability: 3, subRegions: [mu.quads.vasti] }
  cues:
    - en: Place your feet shoulder-width in the middle of the platform.
    - en: Lower the sled until your knees are well bent, without your lower back lifting off the pad.
    - en: Press through your whole foot and stop just short of locking your knees.
