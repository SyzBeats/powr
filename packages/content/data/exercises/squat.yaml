  load: { type: bodyweightAdded, curveClass: pooled, unilateral: false, bodyweightLoaded: true }
  defaults:
    repRange: { hypertrophy: [15, 30], strength: [6, 12] }
    restClass: hypertrophyCompound
    tempo: 3-0-X-0
    fixedRom: false
    stretchEmphasis: true
  ranking: { overloadSuitability: 1, standard: true }
  cues:
    - en: Stand with your feet about shoulder-width apart and your toes turned slightly out.
    - en: Sit down between your heels as deep as you can while your heels stay flat.
    - en: Stand up tall; slow the descent or add a pause at the bottom once reps get easy.
