# Continuous integration (technical concept §8.21). Every step is a package script, so the
# whole pipeline also runs locally: `pnpm verify`, then `pnpm docker:build`, `pnpm docker:smoke`
# and `pnpm lighthouse`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly run on main; the Lighthouse job runs only here and on pushes to main (§8.20).
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a nightly run never cancels a push run (or its deploy).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  # The app's one public origin (calendar UIDs, any public URL; product owner 2026-11-25): the
  # production origin, shared by beta and production because the image is built once and promoted.
  # A repository variable the product owner sets once the domain is chosen; while it is unset the
  # build keeps the reserved default https://powr.invalid (apps/web/src/app/public-origin.ts). The
  # E2E job reads it too, to expect the same UID host as the build it tests.
  VITE_PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}

jobs:
  quality:
    name: Lint, format, unused code, i18n catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm tokens:check
      - run: pnpm knip
      - run: pnpm i18n:check

  # NFR-SEC-01 (§8.18, M6c): known vulnerabilities in the dependencies. Online (the npm advisory
  # database), so it is its own job and not part of the offline `pnpm verify`. Severity policy:
  # a high or critical advisory in a production dependency fails the job (and the production
  # deploy, deploy.yml); everything else (low and moderate, and every build-only package) is
  # reported here and in the `audit` artifact, and reviewed before each release (runbook §4).
  audit:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # pnpm audit reads the lockfile; no install needed.
      - name: Production dependencies (fails on high or critical)
        run: pnpm audit:prod
      - name: Every dependency (report only)
        if: ${{ !cancelled() }}
        run: pnpm audit:all
      - name: Keep the reports for the release record
        if: ${{ !cancelled() }}
        run: |
          pnpm audit --prod --json > audit-prod.json || true
          pnpm audit --json > audit-all.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: audit
          path: |
            audit-prod.json
            audit-all.json
          retention-days: 90

  typecheck:
    name: Type check (tsc -b)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit, property, migration, architecture and component tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Component tests run in Vitest browser mode on Playwright's Chromium (TD-11).
      - run: pnpm --filter @powr/web exec playwright install --with-deps chromium
      # Property tests use a fixed seed in CI (vitest.setup.ts); a nightly job may set FC_SEED=random.
      - run: pnpm test

  build:
    name: Build, licence gate, size budgets, image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the Vite licence plugin fails the build on a disallowed licence)
        run: pnpm build
        env:
          POWR_BUILD: ${{ github.sha }}
          RELEASE_TARGET: next
      - name: Licence gate (distributed and build-only components)
        run: pnpm licence
      - name: Size budgets
        run: pnpm size
      - name: Build the nginx image
        run: docker build -f deploy/Dockerfile -t powr-web:ci .
      - name: Package list of the image (server-side inventory, licence review L-2)
        # Compare with deploy/server-inventory.yaml; refresh that list when the base image changes.
        run: docker run --rm --entrypoint apk powr-web:ci list --installed | sort > image-packages.txt
      - name: Header smoke test against the image
        run: |
          docker run -d --name powr-web -p 8080:8080 powr-web:ci
          for _ in $(seq 1 30); do curl -fs http://localhost:8080/version.json >/dev/null && break; sleep 1; done
          node deploy/smoke.ts http://localhost:8080 --expect-build "${{ github.sha }}"
          docker rm -f powr-web
      - name: Save the image for E2E and deployment (built once, promoted as is)
        run: docker save powr-web:ci | gzip > powr-web-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: apps/web/dist
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: powr-web-image.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            licence-inventory.json
            image-packages.txt
            apps/web/.licence/
            apps/web/.compiler-report.json
          retention-days: 30

  e2e:
    name: E2E (Playwright, production build with service worker)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: pnpm --filter @powr/web exec playwright install --with-deps chromium
      - name: E2E against the test server (production headers, update and offline scenarios)
        run: pnpm e2e
      - name: E2E against the nginx image
        run: |
          docker load < powr-web-image.tar.gz
          docker run -d --name powr-web -p 8080:8080 powr-web:ci
          for _ in $(seq 1 30); do curl -fs http://localhost:8080/version.json >/dev/null && break; sleep 1; done
          E2E_BASE_URL=http://localhost:8080 pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  kill-test:
    name: Randomised process kills (200 SIGKILLs while logging; NFR-REL-01, QS-01)
    # Too long for every push: nightly and on demand only (TD-13, §8.20). The short 10-kill run is
    # in `pnpm e2e`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist
      - run: pnpm --filter @powr/web exec playwright install --with-deps chromium
      - name: 200 kills (each test prints its seed and the command that repeats it)
        run: pnpm e2e:kill
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: kill-test-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (mobile preset, budgets relative to the baseline)
    # A performance regression guard on main and nightly, not on pull requests (§8.19, §8.20).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/web/dist
      - run: pnpm --filter @powr/web exec playwright install --with-deps chromium
      # Compares with the `ci` entry of apps/web/lighthouse-baseline.json; without one it only
      # reports and leaves a baseline candidate in the artifact.
      - name: Lighthouse against the tested build (production headers, Playwright's Chromium)
        run: pnpm lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          include-hidden-files: true
          retention-days: 30
