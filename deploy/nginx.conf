# POWR static app server (technical concept §7.3). Installed as /etc/nginx/conf.d/default.conf
# in the official nginx:1.30-alpine image; TLS terminates at Traefik (Coolify) in front of it.
server {
  listen 8080;
  listen [::]:8080;
  root /usr/share/nginx/html;
  server_tokens off;
  # Relative redirects (e.g. /legal-static → /legal-static/): nginx would otherwise name its own
  # http scheme and port 8080, which are wrong behind Traefik's TLS.
  absolute_redirect off;

  # Privacy: no access logs (§7.4, NFR-PRIV-06); only critical server errors.
  access_log off;
  error_log /dev/stderr crit;

  # A `types` block replaces the inherited MIME map, so include the full map first.
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }
  charset utf-8;
  charset_types text/css application/javascript application/json application/manifest+json text/plain image/svg+xml;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

  # --- Caching (NFR-REL-08, PWA-04) ---
  # Entry points must be revalidated on every request, or clients would miss updates.
  location ~ ^/(sw\.js|index\.html|manifest\.webmanifest|changelog\.json|version\.json|theme-init\.js)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Content-hashed build output never changes under the same name.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # A missing hashed asset is a 404, never index.html (risk T-06).
    try_files $uri =404;
  }

  location /icons/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # Static website copy of the legal texts (LEG-09, TD-71): plain HTML without scripts, built
  # from the app's texts and revalidated like the entry points. /legal-static/ serves its
  # index.html; a missing page is a 404, never the app shell.
  location /legal-static/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  # --- SPA fallback for deep links (PWA-12) ---
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
