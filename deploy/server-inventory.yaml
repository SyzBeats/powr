# Server-side components (licence review L-2; technical concept §7 and Appendix B; product-owner
# decision 2026-11-25). The publisher runs these on its own server to deliver the app. None of
# them is distributed to users: a user receives only the app's files over HTTPS, never these
# programs. tools/licence records every entry in licence-inventory.json as `kind: server`,
# `distributed: false`. Because nothing here is distributed, the copyleft rules of
# licence-policy.yaml do not apply; `serverDenied` there lists the licences that would bind the
# publisher merely for running a program as a network service, or restrict running it in
# production, and the gate fails on those.
#
# Keep the image private on GHCR (runbook §2): publishing the image would distribute these
# programs, with the source-offer duties of their GPL and LGPL parts.

# Run on the VPS (Ubuntu 24.04 LTS, runbook §1). The versions are the ones the concept plans;
# the installed versions are recorded in runbook §8 when the server is set up (D-01).
server:
  - name: coolify
    version: 4.7.x
    licence: Apache-2.0
    role: Self-hosted deployment platform; pulls the image from GHCR and runs it
  - name: traefik
    version: 3.7.x
    licence: MIT
    role: Coolify's reverse proxy; terminates TLS (Let's Encrypt) in front of nginx

# The web server image (deploy/Dockerfile): the official nginx image plus the app's files and
# deploy/nginx.conf. Package list read on 2026-11-25 with `apk list --installed` from
# nginx:1.30-alpine at the digest below (Alpine 3.24.4, nginx 1.30.8); licences as Alpine
# declares them (nginx's own "2-clause BSD-like license" is BSD-2-Clause). deploy/Dockerfile
# pins the image to this digest (M6d), and `pnpm licence` fails while the two differ: a new
# digest there means regenerating this list from the new image (runbook §6.1; CI saves every
# image's package list as `image-packages.txt` in the `reports` artifact).
